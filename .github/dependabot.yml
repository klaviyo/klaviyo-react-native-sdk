version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: bundler
    directories:
      - /.github/pins/fastlane
    schedule:
      interval: monthly
    groups:
      publish-gems:
        patterns:
          - '*'
