name: Prepare example app release notes
description: >-
  Writes store release notes to a file. The notes lead with the app version,
  the SDK refs and the commit, then the ref, trigger, build time (UTC) and a
  link to the CI run; on `release: published` the release name and body are
  appended. Free text arrives only through env vars. Truncation cuts the
  appended free text first so the header survives the store's length cap
  (500 chars on Play, 4000 on TestFlight).
inputs:
  max_length:
    description: Maximum number of characters to keep (store-specific cap, e.g. 500 for Play, 4000 for TestFlight)
    required: true
  version_label:
    description: App version line, e.g. "2.5.1 (build 7)" for iOS or "2.5.1" for Android
    required: true
outputs:
  notes_file:
    description: Path to the file containing the release notes
    value: ${{ steps.notes.outputs.notes_file }}
  sdk_ref:
    description: Compact one-line summary of the RN/Android/iOS SDK refs (empty when sdk-ref.js is unavailable)
    value: ${{ steps.notes.outputs.sdk_ref }}

runs:
  using: composite
  steps:
    # Requires node on PATH (the workflow's setup action runs before this).
    - id: notes
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_BODY: ${{ github.event.release.body }}
        RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        # The PR merge ref's name ("123/merge") and SHA aren't meaningful to
        # testers, so prefer the PR head for labeled-PR runs.
        REF_NAME: ${{ github.head_ref || github.ref_name }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        VERSION_LABEL: ${{ inputs.version_label }}
        MAX_LENGTH: ${{ inputs.max_length }}
        # Character-based truncation below is locale-aware; pin a UTF-8
        # locale so multi-byte characters near the cut are never split.
        # C.UTF-8 is guaranteed on ubuntu-24.04 and macOS runners.
        LC_ALL: C.UTF-8
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "pull_request" ]; then
          SUBJECT="PR #${PR_NUMBER}: ${PR_TITLE}"
        else
          SUBJECT=$(git log -1 --format=%s "$SHA" 2>/dev/null || true)
        fi

        # `--print` emits "Label: value" lines; awk compacts them to
        # `RN 2.5.1 (...) | Android 4.5.1 | iOS 5.4.1`.
        SDK_REF=""
        if [ -f example/scripts/sdk-ref.js ]; then
          SDK_REF=$(node example/scripts/sdk-ref.js --print \
            | awk -F': +' '{ sub(/ SDK$/, "", $1); out = out (out ? " | " : "") $1 " " $2 } END { print out }' \
            || true)
        fi

        HEADER="Version ${VERSION_LABEL}"
        [ -n "$SDK_REF" ] && HEADER="${HEADER}"$'\n'"SDK: ${SDK_REF}"
        HEADER="${HEADER}"$'\n'"Commit: ${SHA:0:7} ${SUBJECT}"
        HEADER="${HEADER}"$'\n'"Ref: ${REF_NAME} (${EVENT_NAME})"
        HEADER="${HEADER}"$'\n'"Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
        HEADER="${HEADER}"$'\n'"CI run: ${RUN_URL}"

        NOTES="$HEADER"
        if [ "$EVENT_NAME" = "release" ]; then
          TRAILER=$'\n\n'"Release notes (${RELEASE_NAME}):"$'\n'"${RELEASE_BODY}"
          # Cut the release text first so the header survives the cap.
          BUDGET=$(( MAX_LENGTH - ${#HEADER} ))
          if [ "$BUDGET" -lt 0 ]; then BUDGET=0; fi
          NOTES="${HEADER}${TRAILER:0:$BUDGET}"
        fi

        NOTES_FILE="${RUNNER_TEMP}/release-notes-${MAX_LENGTH}.txt"
        printf '%s' "${NOTES:0:${MAX_LENGTH}}" > "$NOTES_FILE"
        echo "Release notes:"
        cat "$NOTES_FILE"
        echo
        echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
        echo "sdk_ref=$SDK_REF" >> "$GITHUB_OUTPUT"
