name: Notify Slack of example app publish result
description: Posts a Slack message summarizing a publish job (success or failure) for the React Native SDK example app.
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success' or 'failure' — drives icon and headline"
    required: true
  platform:
    description: "Human-readable platform label: 'iOS' or 'Android'"
    required: true
  store:
    description: "Human-readable store label: 'TestFlight' or 'Play internal'"
    required: true
  full_version:
    description: Full package.json version, suffix included (e.g. 2.6.0-rc.1)
    required: false
    default: ''
  build:
    description: Build number (iOS) or versionCode (Android)
    required: false
    default: ''
  rn_version:
    description: RN SDK semver (empty renders as a dash)
    required: false
    default: ''
  rn_ref:
    description: RN SDK ref; omitted from the message when equal to rn_version
    required: false
    default: ''
  native_name:
    description: "Native SDK label: 'iOS' or 'Android'"
    required: true
  native_version:
    description: Native SDK semver (empty renders as a dash)
    required: false
    default: ''
  native_ref:
    description: Native SDK ref; omitted from the message when equal to native_version
    required: false
    default: ''
  failed_step:
    description: Name of the step that failed, shown in the failure headline. A composite action cannot see its caller's steps, so the caller passes it. Defaults to "unknown step".
    required: false
    default: ''
  install_url:
    description: Optional install link to surface in the message (e.g. internal-sharing download URL). Only useful to users already authorized for the build.
    required: false
    default: ''
  install_label:
    description: Link text for install_url
    required: false
    default: Tap to install build
  install_fallback:
    description: Text shown in place of the install link when install_url is empty. When unset, an empty install_url omits the line entirely.
    required: false
    default: ''
  access_note:
    description: Optional plain-text instructions for reaching the build (e.g. who can see it and where). Must not contain public/unauthenticated links — this repo's logs are public.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Free text (a release tag can contain a double quote) is computed in a
    # step and written to a file; the payload is built as JSON from that file,
    # never interpolated into YAML.
    - name: Compose message
      id: message
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        PLATFORM: ${{ inputs.platform }}
        STORE: ${{ inputs.store }}
        FULL_VERSION: ${{ inputs.full_version }}
        BUILD: ${{ inputs.build }}
        RN_VERSION: ${{ inputs.rn_version }}
        RN_REF: ${{ inputs.rn_ref }}
        NATIVE_NAME: ${{ inputs.native_name }}
        NATIVE_VERSION: ${{ inputs.native_version }}
        NATIVE_REF: ${{ inputs.native_ref }}
        FAILED_STEP: ${{ inputs.failed_step }}
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        # On pull_request events github.sha is the synthetic merge commit, so
        # use the PR head — the same commit the release notes report.
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        INSTALL_URL: ${{ inputs.install_url }}
        INSTALL_LABEL: ${{ inputs.install_label }}
        INSTALL_FALLBACK: ${{ inputs.install_fallback }}
        ACCESS_NOTE: ${{ inputs.access_note }}
      run: |
        export EVENT_NAME RELEASE_TAG HEAD_REF REF_NAME
        SOURCE_LABEL=$("${{ github.workspace }}/.github/scripts/source-label.sh")
        export SOURCE_LABEL
        "${{ github.workspace }}/.github/scripts/slack-publish-text.sh" > "${RUNNER_TEMP}/slack-text.txt"
        "${{ github.workspace }}/.github/scripts/slack-payload.sh" "${RUNNER_TEMP}/slack-text.txt" > "${RUNNER_TEMP}/slack-payload.json"
        echo "payload_file=${RUNNER_TEMP}/slack-payload.json" >> "$GITHUB_OUTPUT"

    # SLACK_WEBHOOK_URL is optional: when it is empty the notification is
    # skipped rather than failing the run.
    - name: Skip without a webhook
      if: inputs.webhook == ''
      shell: bash
      run: echo "::notice::SLACK_WEBHOOK_URL is not set; skipping the Slack notification"

    - if: inputs.webhook != ''
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ steps.message.outputs.payload_file }}
