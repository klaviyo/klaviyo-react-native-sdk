name: Notify Slack of publish result
description: Posts a Slack message summarizing a publish job for the React Native SDK (npm) or its example app. Skipped when no webhook is set.
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success', 'failure', 'warning' (uploaded, but What to Test failed) or 'pending' / 'stopped' (release only: awaiting approval / rejected or cancelled)"
    required: true
  platform:
    description: "'iOS', 'Android', 'npm' or 'release' (dispatch release workflow)"
    required: true
  store:
    description: "'TestFlight' or 'Play internal' (example app only; ignored for npm)"
    required: false
    default: ''
  dist_tag:
    description: npm dist-tag published to (npm only)
    required: false
    default: ''
  already_published:
    description: "'true' when the npm version was already live and nothing was published"
    required: false
    default:
  reason:
    description: Why a release stopped ('stopped'), or a caveat for the approver ('pending')
    required: false
    default: ''
  full_version:
    description: Full derived app version, suffix included (e.g. 2.6.0-rc.7)
    required: false
    default: ''
  build:
    description: Build number (iOS) or versionCode (Android)
    required: false
    default: ''
  sdks:
    description: One-line SDK summary from the release notes action
    required: false
    default: ''
  steps_json:
    description: toJSON(steps) from the caller, used to name the failed step
    required: false
    default: ''
  install_url:
    description: Install link for users already authorized for the build
    required: false
    default: ''
  install_label:
    description: Link text for install_url
    required: false
    default: Tap to install build
  install_fallback:
    description: Text shown when install_url is empty
    required: false
    default: ''
  access_note:
    description: Plain-text instructions for reaching the build. Must not contain public links; this repo's logs are public.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Compose message
      id: message
      if: inputs.webhook != ''
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        PLATFORM: ${{ inputs.platform }}
        STORE: ${{ inputs.store }}
        FULL_VERSION: ${{ inputs.full_version }}
        BUILD: ${{ inputs.build }}
        SDKS: ${{ inputs.sdks }}
        STEPS_JSON: ${{ inputs.steps_json }}
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        INSTALL_URL: ${{ inputs.install_url }}
        INSTALL_LABEL: ${{ inputs.install_label }}
        INSTALL_FALLBACK: ${{ inputs.install_fallback }}
        ACCESS_NOTE: ${{ inputs.access_note }}
        DIST_TAG: ${{ inputs.dist_tag }}
        ALREADY_PUBLISHED: ${{ inputs.already_published }}
        REASON: ${{ inputs.reason }}
      run: |
        "${{ github.workspace }}/.github/scripts/slack-message.sh" > "${RUNNER_TEMP}/slack-payload.json"
        echo "payload_file=${RUNNER_TEMP}/slack-payload.json" >> "$GITHUB_OUTPUT"

    - if: inputs.webhook != ''
      uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload-file-path: ${{ steps.message.outputs.payload_file }}
