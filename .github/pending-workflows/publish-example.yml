# Publish the example app to Play internal track + TestFlight. Android and
# iOS are independent jobs.
#
# Triggers:
#   - workflow_dispatch     (manual; choose `both` / `android` / `ios`)
#   - release: published    (both platforms)
#   - push to master/rel/** (both platforms)
#   - pull_request: labeled (label drives platform selection — see below)
#
# Label conventions (cleanup-label removes them after the run so reapplying
# re-triggers):
#   - `deploy-example-app`         → both platforms
#   - `deploy-example-app:android` → Android only
#   - `deploy-example-app:ios`     → iOS only
#
# Build numbers: each job preflights the store for highest+1, then retries
# with a fresh number if the upload itself is rejected for a conflict (e.g.
# two runs racing on master + rel/**).
#
# This repo is public, so its Actions logs are too. Never surface a public
# install link (e.g. a TestFlight public-link `testflight.apple.com/join/...`)
# here; only links that require a Play/App Store Connect login.

name: Publish Example App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to publish'
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
  release:
    types: [published]
  push:
    branches: [master, 'rel/**']
  pull_request:
    types: [labeled]

jobs:
  deploy-android:
    name: Publish to Play Store internal track
    runs-on: ubuntu-24.04
    # Run on release / push always; on workflow_dispatch when platform is
    # `both` or `android`; on labeled PR when the label is `deploy-example-app`
    # (umbrella) or `deploy-example-app:android`.
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'android'))
      || (github.event_name == 'pull_request' && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:android'))

    steps:
      - uses: actions/checkout@v5

      - name: Prep example app
        uses: ./.github/actions/example-publish-prep
        with:
          api_key: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}

      # bundleRelease invokes Metro via the RN Gradle plugin; node + yarn must be on PATH.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: jdk

      - name: Add Google Services from Secrets
        run: 'echo "$GOOGLE_SERVICES_JSON" > ./example/android/app/google-services.json'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode upload keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/upload.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Read versionName (kept in sync with SDK version by bump-version.sh)
      # so Slack notifications can include it on success or failure.
      - name: Read versionName
        shell: bash
        run: |
          VERSION_NAME=$(grep -oE 'versionName "[^"]+"' example/android/app/build.gradle | head -1 | sed -E 's/versionName "([^"]+)"/\1/')
          echo "Version name: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      # Auth for the Play Edits API calls in play-publish.sh.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      # Pick highest+1 versionCode. The script aborts on any HTTP error so we
      # don't silently fall back to HIGHEST=0.
      - name: Resolve next versionCode from Play
        shell: bash
        env:
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
        run: |
          set -euo pipefail
          HIGHEST=$(.github/scripts/play-publish.sh highest-version-code)
          NEXT=$(( HIGHEST + 1 ))
          echo "Highest existing versionCode: $HIGHEST"
          echo "Next versionCode: $NEXT"
          echo "VERSION_CODE=$NEXT" >> $GITHUB_ENV

      # Build the example app against the SDK as `npm install`-ed from a
      # tarball, not the workspace symlink. Catches `files`-allowlist drift,
      # podspec/build.gradle path bugs, and stale `lib/` builds before the
      # AAB hits Play's internal track. Cleanup (`restore`) is intentionally
      # skipped — the runner is ephemeral. See pack-and-test.sh for details.
      - name: Pack SDK + flip example to packed install
        shell: bash
        run: ./pack-and-test.sh setup

      # Play Store release notes: the GitHub release body on `release`,
      # otherwise synthesized from git metadata. 500 chars is Google's
      # per-locale cap.
      - name: Prepare release notes
        id: release_notes
        uses: ./.github/actions/example-release-notes
        with:
          max_length: 500

      # Build + upload in one loop so a versionCode conflict at upload time
      # (another run published the same code after our preflight) rebuilds
      # with a fresh code instead of failing. play-publish.sh exits 75 only
      # for a conflict; any other error fails the step immediately.
      #
      # Inline signing via -Pandroid.injected.signing.* — AGP produces a
      # properly v2/v3-signed AAB in one pass (Play rejects double-signed AABs).
      - name: Build & deploy to Internal Track
        shell: bash
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
          # Prevent Metro from trying to start a dev server during the build
          CI: true
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          AAB="example/android/app/build/outputs/bundle/release/app-release.aab"

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Attempt $attempt/$MAX_ATTEMPTS: versionCode $VERSION_CODE ==="
            (cd example/android && ./gradlew :app:bundleRelease \
              -PreleaseVersionCode="$VERSION_CODE" \
              -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/upload.jks" \
              -Pandroid.injected.signing.store.password="${KEY_STORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}")

            status=0
            RELEASE_NAME="$VERSION_NAME ($VERSION_CODE)" \
              .github/scripts/play-publish.sh upload "$AAB" "$VERSION_CODE" internal "$NOTES_FILE" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            elif [ "$status" -ne 75 ]; then
              exit "$status"
            fi

            HIGHEST=$(.github/scripts/play-publish.sh highest-version-code)
            NEXT=$(( (HIGHEST > VERSION_CODE ? HIGHEST : VERSION_CODE) + 1 ))
            echo "::warning::versionCode $VERSION_CODE conflicted at upload; retrying with $NEXT"
            VERSION_CODE=$NEXT
            echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          done

          echo "::error::Upload still conflicting after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"

      - name: Notify Slack on success
        if: success()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: Play Store
          version_label: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          # Standard `play.google.com/apps/test/<pkg>/<code>` URL (what
          # r0adkll/upload-google-play used to emit), only resolvable by users
          # already authorized for the build.
          install_url: https://play.google.com/apps/test/com.klaviyoreactnativesdkexample/${{ env.VERSION_CODE }}

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: Play Store
          version_label: ${{ env.VERSION_NAME || '?' }} (${{ env.VERSION_CODE || '?' }})

  deploy-ios:
    name: Publish to TestFlight
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    # Run on release / push always; on workflow_dispatch when platform is
    # `both` or `ios`; on labeled PR when the label is `deploy-example-app`
    # (umbrella) or `deploy-example-app:ios`.
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
      || (github.event_name == 'pull_request' && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios'))

    steps:
      - uses: actions/checkout@v5

      - name: Prep example app
        uses: ./.github/actions/example-publish-prep
        with:
          api_key: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}

      # The RN Xcode build phase invokes Metro during archive; node + yarn must be on PATH.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # ruby-version is read from example/.ruby-version. bundler-cache:true
          # also runs `bundle install --frozen` against example/Gemfile, so
          # any Gemfile / Gemfile.lock drift fails this step early.
          working-directory: example
          bundler-cache: true

      # setup-ruby switches the job to the example's pinned Ruby, which hides the
      # runner's preinstalled fastlane and doesn't have it as a gem. Install it
      # explicitly into the active Ruby so `fastlane` resolves deterministically.
      # Kept out of example/Gemfile to avoid bloating the CocoaPods-only bundle.
      - name: Install fastlane
        shell: bash
        run: gem install fastlane -v 2.237.0 --no-document

      # Real GoogleService-Info.plist (com.klaviyoreactnativesdkexample) so
      # push delivery works against the published build.
      - name: Inject GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        shell: bash
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > example/ios/GoogleService-Info.plist

      # See ios-build.yml's Cache Pods step for the cache-key rationale.
      - name: Cache Pods
        uses: actions/cache@v5
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-publish-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock', 'example/.ruby-version', '*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-publish-

      # Build the example app against the SDK as `npm install`-ed from a
      # tarball, not the workspace symlink. Catches `files`-allowlist drift,
      # podspec path bugs, and stale `lib/` builds before the IPA hits
      # TestFlight. Cleanup (`restore`) is intentionally skipped — the
      # runner is ephemeral. See pack-and-test.sh for details. Must run
      # before "Install CocoaPods dependencies" so that pod install picks
      # up the packed-mode resolution (marker is set, react-native.config.js
      # points at example/node_modules/<sdk>).
      - name: Pack SDK + flip example to packed install
        shell: bash
        run: ./pack-and-test.sh setup

      # --repo-update so stale CDN caches can't pin us to old versions.
      # Delete .xcode.env.local so the Xcode build phase falls back to
      # `command -v node` (resolves to the setup-node binary on $PATH).
      # RCT_NEW_ARCH_ENABLED=1 is required for new-arch codegen to run
      # during pod install — otherwise xcodebuild fails on missing headers
      # like RCTAppDependencyProvider.h. With pack-and-test having flipped
      # the marker above, this pod install runs in packed mode.
      - name: Install CocoaPods dependencies
        working-directory: example/ios
        shell: bash
        env:
          RCT_NEW_ARCH_ENABLED: '1'
        run: |
          bundle exec pod install --repo-update
          rm -f .xcode.env.local

      # Apple tools auto-discover the .p8 at this conventional path.
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # MARKETING_VERSION is kept in sync with the SDK by bump-version.sh.
      - name: Read marketing version
        shell: bash
        run: |
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION = ' example/ios/KlaviyoReactNativeSdkExample.xcodeproj/project.pbxproj | awk -F' = ' '{print $2}' | tr -d '; ')
          echo "Marketing version: $MARKETING_VERSION"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> $GITHUB_ENV

      # Pick latest+1 CFBundleVersion (mirrors the Android preflight). `jwt`
      # is installed inline rather than added to example/Gemfile.
      - name: Resolve next build number from App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
        shell: bash
        run: |
          gem install jwt --no-document --silent
          ruby .github/scripts/asc.rb next-build-number

      # TestFlight "What to Test": same source as the Play notes. 4000 chars
      # is App Store Connect's whatsNew cap.
      - name: Prepare release notes
        id: release_notes
        uses: ./.github/actions/example-release-notes
        with:
          max_length: 4000

      # Build, sign and upload in one loop (ported from klaviyo-ios-test-app's
      # testflight.yml) so a build-number conflict at upload time rebuilds with
      # a fresh number instead of failing.
      #
      # The `release_ipa` lane runs match(readonly) to install the shared App
      # Store cert + profiles from the mobile-certificates repo (git-only, never
      # contacts Apple, so no cert is generated), pins each target to its match
      # profile, and exports a signed IPA to example/ios/build/. It's safe to
      # re-run: the keychain and imported certs are reused. ssh-agent is started
      # inline because its env can't cross workflow steps.
      #
      # altool authenticates with the API key — no Apple ID / app-specific
      # password / 2FA dance. agvtool updates CFBundleVersion across all targets.
      - name: Build, sign & upload to TestFlight
        working-directory: example
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          # For asc.rb when re-resolving the build number after a conflict.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Password-protected distribution key: match imports keys with an empty
          # password, which macOS 26's `security import` rejects, so the lane
          # imports this one itself. See example/fastlane/Fastfile.
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          # RN build-phase scripts read this directly to wire codegen outputs.
          RCT_NEW_ARCH_ENABLED: '1'
          # Prevent Metro from starting a dev server.
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add -
          CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_P12_PATH"
          export CERT_P12_PATH

          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Attempt $attempt/$MAX_ATTEMPTS: build number $BUILD_NUMBER ==="
            rm -f ios/build/KlaviyoReactNativeSdkExample.ipa
            (cd ios && xcrun agvtool new-version -all "$BUILD_NUMBER")
            fastlane ios release_ipa

            status=0
            UPLOAD_OUTPUT=$(xcrun altool --upload-app --type ios \
              --file "ios/build/KlaviyoReactNativeSdkExample.ipa" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1) || status=$?
            echo "$UPLOAD_OUTPUT"

            # altool can exit 0 while reporting an error, so check both.
            if [ "$status" -eq 0 ] && ! grep -q "ERROR:" <<<"$UPLOAD_OUTPUT"; then
              exit 0
            fi

            # A duplicate CFBundleVersion is reported with the previous
            # version in the payload; anything else is non-recoverable.
            if ! grep -qiE 'previousBundleVersion|bundle version must be higher|has already been used|DUPLICATE' <<<"$UPLOAD_OUTPUT"; then
              echo "::error::TestFlight upload failed with a non-recoverable error"
              exit 1
            fi

            PREV_BUILD=$(grep -oE 'previousBundleVersion = [0-9]+' <<<"$UPLOAD_OUTPUT" | head -1 | grep -oE '[0-9]+' || true)
            CURRENT=$BUILD_NUMBER
            ruby ../.github/scripts/asc.rb next-build-number >/dev/null
            # asc.rb appended the fresh value to $GITHUB_ENV; take the max of
            # that, altool's previousBundleVersion + 1 and ours + 1.
            ASC_NEXT=$(grep -E '^BUILD_NUMBER=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)
            NEXT=$(( CURRENT + 1 ))
            if [ -n "$PREV_BUILD" ] && [ $(( PREV_BUILD + 1 )) -gt "$NEXT" ]; then
              NEXT=$(( PREV_BUILD + 1 ))
            fi
            if [ "$ASC_NEXT" -gt "$NEXT" ]; then
              NEXT=$ASC_NEXT
            fi
            echo "::warning::Build number $CURRENT conflicted at upload; retrying with $NEXT"
            BUILD_NUMBER=$NEXT
            echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          done

          echo "::error::Upload still conflicting after $MAX_ATTEMPTS attempts"
          exit 1

      # Best effort: the build is already on TestFlight, so a failure here
      # only costs the notes and shouldn't report the publish as failed.
      - name: Set TestFlight "What to Test"
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        shell: bash
        run: ruby .github/scripts/asc.rb set-whats-new "$MARKETING_VERSION" "$BUILD_NUMBER" "$NOTES_FILE"

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Notify Slack on success
        if: success()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: TestFlight
          version_label: ${{ env.MARKETING_VERSION }} (${{ env.BUILD_NUMBER }})
          # App Store Connect page for the build (or the app's TestFlight tab
          # if the build lookup failed). Requires an ASC login, so it's safe
          # in this public repo's logs. Deliberately NOT a TestFlight public
          # link, which would let anyone install the build.
          install_url: ${{ env.ASC_BUILD_ID && format('https://appstoreconnect.apple.com/apps/{0}/testflight/ios/{1}', env.ASC_APP_ID, env.ASC_BUILD_ID) || format('https://appstoreconnect.apple.com/apps/{0}/testflight/ios', env.ASC_APP_ID) }}
          install_label: View build in App Store Connect
          access_note: Internal testers get it in the TestFlight app (iOS) once processing finishes, usually 10–30 min. No access? Ask an App Store Connect admin to add your Apple ID to the example app's internal testing group.

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: TestFlight
          version_label: ${{ env.MARKETING_VERSION || '?' }} (${{ env.BUILD_NUMBER || '?' }})

  # Remove the deploy-example-app[:platform] label after the run so reapplying
  # re-triggers. Handles all three variants: umbrella, :android, :ios.
  cleanup-label:
    name: Remove deploy-example-app label
    needs: [deploy-android, deploy-ios]
    if: |
      always()
      && github.event_name == 'pull_request'
      && startsWith(github.event.label.name, 'deploy-example-app')
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        uses: actions/github-script@v7
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL_NAME,
              });
            } catch (e) {
              // 404 = label already gone (e.g. removed manually mid-run).
              if (e.status !== 404) throw e;
            }
