# Builds the TypeDoc API reference from master and publishes it to GitHub Pages
# (https://klaviyo.github.io/klaviyo-react-native-sdk/) using the built-in GITHUB_TOKEN.
# Requires Settings → Pages → Source = "GitHub Actions".
name: Documentation Bot

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

# One Pages deployment at a time. Don't cancel an in-flight deploy; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build TypeDoc
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate docs
        run: yarn generate-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only master is published, even if the workflow is dispatched from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify-failure:
    name: Notify Slack on failure
    needs: [build, deploy]
    # Runs only if build or deploy failed; skipped on success, cancellation, or a skipped deploy.
    if: failure()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Send Slack notification on failure
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 Documentation Bot Workflow Failed"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨 Documentation Bot Workflow Failed\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* ${{ github.repository }}\n*Ref:* `${{ github.ref_name }}`\n*Event:* ${{ github.event_name }}\n*Common Issue:* Check the TypeDoc build and the GitHub Pages deploy (Settings → Pages → Source must be \"GitHub Actions\")"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
