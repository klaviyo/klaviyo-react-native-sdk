# Builds the TypeDoc API reference from master and publishes it to GitHub Pages
# (https://klaviyo.github.io/klaviyo-react-native-sdk/) using the built-in GITHUB_TOKEN.
# Requires Settings → Pages → Source = "GitHub Actions".
name: Documentation Bot

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '!src/__tests__/**'
      - 'package.json'
      - 'README.md'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'yarn.lock'
      - '.github/workflows/doc-bot.yml'
  workflow_dispatch:

permissions: {}

env:
  SLACK_USERNAME: React Native SDK
  SLACK_ICON_EMOJI: ':merlin-orb-react-native:'

# One Pages deployment at a time. Don't cancel an in-flight deploy; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build TypeDoc
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate docs
        run: yarn generate-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only master is published, even if the workflow is dispatched from another branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  notify:
    name: Notify Slack
    needs: [build, deploy]
    # Posts when build or deploy failed, or when deploy succeeded; stays quiet on cancellation or a skipped deploy.
    if: always() && (contains(needs.*.result, 'failure') || needs.deploy.result == 'success')
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Send Slack notification on success
        if: needs.deploy.result == 'success'
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: success
          title: React Native SDK docs deployed to GitHub Pages
          fields: |
            Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Event: ${{ github.event_name }}
          links: |
            Docs|${{ needs.deploy.outputs.page_url }}

      - name: Send Slack notification on failure
        if: contains(needs.*.result, 'failure')
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: failure
          title: Documentation Bot workflow failed
          body: 'Common issue: check the TypeDoc build and the GitHub Pages deploy (Settings → Pages → Source must be "GitHub Actions").'
          fields: |
            Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Event: ${{ github.event_name }}
