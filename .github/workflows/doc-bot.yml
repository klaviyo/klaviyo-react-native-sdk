name: Documentation Bot

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  generate-documentation:
    runs-on: ubuntu-24.04
    env:
      CI_COMMIT_MESSAGE: Generated docs for ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GH_ACTION_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: documentation
          fetch-depth: 0
          token: ${{ secrets.GH_ACTION_ACCESS_TOKEN }}

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin master

      - name: Merge latest from master
        run: |
          git merge origin/master --commit --no-edit --strategy-option theirs

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate docs
        run: |
          yarn generate-docs

      - name: Commit and push docs
        run: |
          if [ $(git status -s -uno | wc -l) -eq 0 ]; then
            echo "No documentation to change"
            exit 0
          fi

          git add docs
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push

      - name: Send Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 Documentation Bot Workflow Failed"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨 Documentation Bot Workflow Failed\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* ${{ github.repository }}\n*Ref:* `${{ github.ref_name }}`\n*Event:* ${{ github.event_name }}\n*Common Issue:* Check if GH_ACTION_ACCESS_TOKEN has expired"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
