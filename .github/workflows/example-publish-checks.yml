# Validates the example app publish workflow and its helpers on PRs without
# building or uploading anything. The asc-dry-run job carries App Store
# Connect and Play credentials, so it is gated to manual runs on master.
name: Example Publish Checks

on:
  pull_request:
    paths:
      - '.github/workflows/publish-example.yml'
      - '.github/workflows/example-publish-checks.yml'
      - '.github/scripts/**'
      - '.github/actions/example-release-notes/**'
      - '.github/actions/notify-slack-publish/**'
      - 'example/scripts/**'
      - 'bump-version.sh'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint workflows and test helpers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint .github/workflows/publish-example.yml .github/workflows/example-publish-checks.yml

      - name: Shellcheck scripts
        run: shellcheck .github/scripts/*.sh bump-version.sh

      - name: Test gradle-retry.sh
        run: .github/scripts/test-gradle-retry.sh

      - name: Test play-publish.sh
        run: .github/scripts/test-play-publish.sh

      - name: Test bump-version.sh marketing-version strip
        run: .github/scripts/test-bump-version.sh

      - name: Test source-label.sh
        run: .github/scripts/test-source-label.sh

      - name: Test check-secrets.sh
        run: .github/scripts/test-check-secrets.sh

      - name: Test truncate-notes.sh
        run: .github/scripts/test-truncate-notes.sh

      - name: Test slack-publish-text.sh
        run: .github/scripts/test-slack-publish-text.sh

      - name: Test slack-payload.sh
        run: .github/scripts/test-slack-payload.sh

      - name: Test failed-step.sh
        run: .github/scripts/test-failed-step.sh

      - name: Test assert-artifact-version.sh
        run: .github/scripts/test-assert-artifact-version.sh

      - name: Guard GitHub expressions
        run: |
          .github/scripts/check-expressions.sh
          .github/scripts/test-check-expressions.sh

      - name: Guard publish workflow invariants
        run: .github/scripts/check-workflow-guards.sh

      # The runner's system Ruby installs gems to a root-owned directory.
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.2'

      - name: Test asc.rb
        run: |
          gem install jwt webrick --no-document --silent
          ruby .github/scripts/test_asc.rb

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test example/scripts
        run: yarn jest example/scripts

      - name: Test in-app build info generator flags
        run: .github/scripts/test-sdk-ref-build-info.sh

      - name: Test notes header reads from example/.env
        run: .github/scripts/test-notes-from-env.sh

  asc-dry-run:
    name: Read-only store queries
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.workflow == 'Example Publish Checks'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Query next TestFlight build number
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
        shell: bash
        run: |
          gem install jwt --no-document --silent
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION = ' example/ios/KlaviyoReactNativeSdkExample.xcodeproj/project.pbxproj | awk -F' = ' '{print $2}' | tr -d '; ')
          ruby .github/scripts/asc.rb next-build-number --marketing-version "$MARKETING_VERSION"

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Query highest Play versionCode
        shell: bash
        env:
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
        run: .github/scripts/play-publish.sh highest-version-code
