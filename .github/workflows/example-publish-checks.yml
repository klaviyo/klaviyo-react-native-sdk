# Validates the example app publish workflow and its helpers on PRs without
# building or uploading anything. The asc-dry-run job carries App Store
# Connect and Play credentials, so it is gated to manual runs on master.
name: Example Publish Checks

on:
  pull_request:
    paths:
      - '.github/workflows/publish-example.yml'
      - '.github/workflows/example-publish-checks.yml'
      - '.github/scripts/**'
      - '.github/actions/example-release-notes/**'
      - '.github/actions/notify-slack-publish/**'
      - 'example/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint workflows and test helpers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # macos-26 is not in actionlint 1.7.7's runner table yet.
      - name: Lint workflows
        run: actionlint -ignore 'label "macos-26" is unknown' .github/workflows/publish-example.yml .github/workflows/example-publish-checks.yml

      - name: Shellcheck scripts
        run: shellcheck .github/scripts/*.sh

      - name: Test gradle-retry.sh
        run: .github/scripts/test-gradle-retry.sh

      - name: Test play-publish.sh
        run: .github/scripts/test-play-publish.sh

      - name: Test asc.rb
        run: |
          gem install jwt webrick --no-document --silent
          ruby .github/scripts/test_asc.rb

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test example/scripts
        run: yarn jest example/scripts

  asc-dry-run:
    name: Read-only store queries
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Query next TestFlight build number
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
        shell: bash
        run: |
          gem install jwt --no-document --silent
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION = ' example/ios/KlaviyoReactNativeSdkExample.xcodeproj/project.pbxproj | awk -F' = ' '{print $2}' | tr -d '; ')
          ruby .github/scripts/asc.rb next-build-number --marketing-version "$MARKETING_VERSION"

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Query highest Play versionCode
        shell: bash
        env:
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
        run: .github/scripts/play-publish.sh highest-version-code
