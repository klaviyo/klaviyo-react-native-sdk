name: Release Branch

# Creates a rel/X.Y.Z branch from base (default master) containing the version bump commit.
# Does nothing if that branch already exists. Opens a draft PR from it into master if it has none.
#
# Run by hand or from the CLI (gh workflow run rel-branch.yml -f bump=minor).
#
# The native SDKs send a `native-rel-branch` repository_dispatch to pin their branch:
# client_payload {android|ios: "rel/X.Y.Z", triggered_by: "<person>"}.
#
# The weekday schedule (13:00 UTC, Mon-Fri) runs with the defaults: bump=minor, steps=1, base=master.
# That keeps a branch for the next minor release open: e.g. with 2.7.0 released it creates rel/2.8.0,
# and no-ops until 2.8.0 is tagged, then creates rel/2.9.0 the next weekday morning.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest stable version to increment
        type: choice
        options: [patch, minor, major]
        default: minor
      steps:
        description: How many increments past the latest stable release
        type: number
        default: 1
      version:
        description: Explicit X.Y.Z, overrides bump and steps
        type: string
        required: false
      base:
        description: Branch, tag or sha to cut from
        type: string
        required: false
        default: master
      triggered_by:
        description: Person to credit in Slack when another workflow starts this one
        type: string
        required: false
      android:
        description: Android SDK version or rel/* branch to pin
        type: string
        required: false
        default: ''
      ios:
        description: iOS SDK version or rel/* branch to pin
        type: string
        required: false
        default: ''
  repository_dispatch:
    types: [native-rel-branch]
  schedule:
    - cron: '0 13 * * 1-5'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SLACK_USERNAME: React Native SDK
  SLACK_ICON_EMOJI: ':merlin-orb-react-native:'
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898333+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898333+github-actions[bot]@users.noreply.github.com

concurrency:
  group: rel-branch
  cancel-in-progress: false

jobs:
  rel_branch:
    name: Create release branch
    uses: ./.github/workflows/rel-branch-core.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit
    with:
      bump: ${{ inputs.bump || 'minor' }}
      steps: ${{ github.event_name != 'workflow_dispatch' && 1 || inputs.steps }}
      version: ${{ inputs.version }}
      base: ${{ inputs.base || 'master' }}
      triggered_by: ${{ inputs.triggered_by || github.event.client_payload.triggered_by }}
      sdk-name: React Native SDK
      slack-username: React Native SDK
      slack-icon-emoji: ':merlin-orb-react-native:'
      bump-command: ./bump-version.sh -v "$VERSION" --skip-native --skip-install
      dispatch-input: react_native
      dispatch-targets: klaviyo-expo-plugin
      dispatch-label: '`Expo plugin`'

  pin:
    name: Pin native SDKs
    needs: rel_branch
    if: success() && (inputs.android || github.event.client_payload.android || inputs.ios || github.event.client_payload.ios) != ''
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.rel_branch.outputs.version }}
      BRANCH: ${{ needs.rel_branch.outputs.branch }}
      PIN_BRANCH: chore/pin-natives-${{ needs.rel_branch.outputs.version }}
      ANDROID: ${{ inputs.android || github.event.client_payload.android }}
      IOS: ${{ inputs.ios || github.event.client_payload.ios }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.X_REPO_PAT }}
          ref: ${{ needs.rel_branch.outputs.branch }}
          fetch-depth: 0

      - name: Continue an open pin branch
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/$PIN_BRANCH" > /dev/null; then
            git fetch --quiet origin "+refs/heads/$PIN_BRANCH:refs/remotes/origin/$PIN_BRANCH"
            git switch -c "$PIN_BRANCH" "origin/$PIN_BRANCH"
            git merge --no-edit "origin/$BRANCH"
            echo "Continuing $PIN_BRANCH so earlier pins are kept"
          else
            git switch -c "$PIN_BRANCH"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          working-directory: example
          bundler-cache: true

      - name: Pin native SDKs
        run: |
          set -euo pipefail

          args=(--skip-pod-install)
          if [ -n "$ANDROID" ]; then
            args+=(--android "$ANDROID")
          fi
          if [ -n "$IOS" ]; then
            args+=(--ios "$IOS")
          fi
          ./configure-sdk.sh "${args[@]}"

      - name: Install dependencies
        run: |
          set -euo pipefail

          yarn install --no-immutable
          (cd example && yarn install --no-immutable)
          (cd example/ios && bundle exec pod update KlaviyoCore KlaviyoSwift KlaviyoForms KlaviyoLocation KlaviyoSwiftExtension)

      - name: Commit pin
        id: commit
        env:
          PIN_PATHS: android/gradle.properties klaviyo-react-native-sdk.podspec example/android/app/build.gradle example/ios/Podfile example/ios/Podfile.lock yarn.lock
        run: |
          set -euo pipefail

          read -ra candidates <<< "$PIN_PATHS"
          paths=()
          for path in "${candidates[@]}"; do
            [ -e "$path" ] && paths+=("$path")
          done
          git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Native pins already match $BRANCH, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --stat

          pinned=()
          [ -n "$ANDROID" ] && pinned+=("Android SDK to $ANDROID")
          [ -n "$IOS" ] && pinned+=("iOS SDK to $IOS")
          joined=$(IFS=,; echo "${pinned[*]}")
          summary=${joined//,/, }
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

          git commit -m "chore: pin $summary"
          git push origin "HEAD:refs/heads/$PIN_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pin PR
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.X_REPO_PAT }}
          SUMMARY: ${{ steps.commit.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2016
          body=$(printf 'Pins the native SDKs on `%s`: %s.\n\nOpened by [Release Branch](%s).' "$BRANCH" "$SUMMARY" "$RUN_URL")
          title="chore: pin native SDKs for $VERSION"

          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PIN_BRANCH" --base "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            gh pr edit "$url" --body "$body"
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --head "$PIN_BRANCH" --title "$title" --body "$body")
          fi
          echo "Pin PR: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of pin PR
        if: success() && steps.pr.outputs.url
        timeout-minutes: 2
        continue-on-error: true
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/notify-slack@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: success
          title: ${{ env.SLACK_USERNAME }} native pins for `${{ needs.rel_branch.outputs.branch }}` opened
          fields: |
            Pinned: ${{ steps.commit.outputs.summary }}
            Triggered by: `${{ needs.rel_branch.outputs.triggered_by }}`
          links: |
            Pull request|${{ steps.pr.outputs.url }}

      - name: Notify Slack of pin failure
        if: failure()
        timeout-minutes: 2
        continue-on-error: true
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/notify-slack@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: failure
          title: ${{ env.SLACK_USERNAME }} native pins for `${{ needs.rel_branch.outputs.branch }}` could not be opened
          fields: |
            Triggered by: `${{ needs.rel_branch.outputs.triggered_by }}`
