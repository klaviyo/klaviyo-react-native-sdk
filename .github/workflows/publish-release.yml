name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z or X.Y.Z-<prerelease>)'
        required: true
        type: string
      ref:
        description: 'Branch (e.g. master, rel/*) or SHA to release; defaults to the default branch'
        required: false
        default: ''
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.preflight.outputs.sha }}
      release_url: ${{ steps.draft.outputs.release_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: Fail if tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Release preflight
        id: preflight
        uses: ./.github/actions/release-preflight
        with:
          version: ${{ inputs.version }}
          github-token: ${{ github.token }}

      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.preflight.outputs.sha }}
        run: |
          set -euo pipefail

          RELEASE_JSON=$(gh release view "$VERSION" --json isDraft,url 2>/dev/null || echo "")

          if [ -n "$RELEASE_JSON" ]; then
            IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
            URL=$(echo "$RELEASE_JSON" | jq -r '.url')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $VERSION already exists and is published"
              exit 1
            fi
            echo "Reusing existing draft release: $URL"
          else
            PRERELEASE_FLAG=()
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE_FLAG=(--prerelease)
            fi
            URL=$(gh release create "$VERSION" --draft --generate-notes --target "$SHA" --title "$VERSION" "${PRERELEASE_FLAG[@]}")
            echo "Created draft release: $URL"
          fi

          echo "release_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write summary
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.preflight.outputs.sha }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
        run: |
          {
            echo "## Publish Release: $VERSION"
            echo ""
            echo "- **Version:** \`$VERSION\`"
            echo "- **SHA:** \`$SHA\`"
            echo "- **Draft release:** $RELEASE_URL"
            echo ""
            echo "Approve the \`npm\` environment on this run to publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack — awaiting approval
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          headline: "⏳ RN SDK ${{ inputs.version }}: draft ready, approve the npm deploy on this run to publish"
          title: RN SDK
          platform: GitHub release
          version_label: ${{ inputs.version }}
          release_url: ${{ steps.draft.outputs.release_url }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          title: RN SDK
          platform: GitHub release
          version_label: ${{ inputs.version }}

  publish-sdk:
    needs: prepare
    uses: ./.github/workflows/publish-sdk.yml
    with:
      version: ${{ inputs.version }}
      release_url: ${{ needs.prepare.outputs.release_url }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: read

  finalize:
    needs: [prepare, publish-sdk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --draft=false --prerelease=true --latest=false --target "$SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$VERSION" --draft=false --prerelease=false --latest --target "$SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Dispatch publish-example
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # App Store Connect only accepts numeric MARKETING_VERSION values, so prereleases deploy the example app to Android only.
          PLATFORM=both
          if [[ "$VERSION" == *-* ]]; then
            PLATFORM=android
          fi
          gh workflow run publish-example.yml --ref "$VERSION" -f platform="$PLATFORM" --repo "$GITHUB_REPOSITORY"

      - name: Write summary
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
        run: |
          {
            echo "## Published: $VERSION"
            echo ""
            echo "- **Release:** $RELEASE_URL"
            echo "- **SDK publish:** [publish-sdk.yml](${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish-sdk.yml)"
            echo "- **Example publish:** [publish-example.yml](${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish-example.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          title: RN SDK
          platform: GitHub release
          version_label: ${{ inputs.version }}
