name: Publish Release

# Entry point for every npm publish: the npm trusted publisher is registered
# for this file. Runs on a release published in the GitHub UI (publishes npm
# only; the release and tag already exist) or on dispatch (creates the draft,
# publishes npm, then publishes the release and dispatches publish-example).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (X.Y.Z or X.Y.Z-<prerelease>)'
        required: true
        type: string
      ref:
        description: 'Branch (e.g. master, rel/*) or SHA to release; defaults to the default branch'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run: run checks, approval and npm publish --dry-run; create and publish nothing'
        required: false
        default: false
        type: boolean
      skip_ci_check:
        description: 'Skip the CI-green check (version, branch and tag checks still run)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions: {}

env:
  TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || (endsWith(github.triggering_actor || github.actor, '[bot]') && format('{0} (automation)', github.workflow) || github.triggering_actor || github.actor) }}
  VERSION: ${{ inputs.version || github.event.release.tag_name }}
  SLACK_USERNAME: React Native SDK
  SLACK_ICON_EMOJI: ':merlin-orb-react-native:'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.preflight.outputs.sha }}
      short_sha: ${{ steps.preflight.outputs.short_sha }}
      release_url: ${{ steps.draft.outputs.release_url }}
      slack_ts: ${{ steps.slack_pending.outputs.ts }}
    steps:
      - id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Require a commit on master or rel/*
        id: branch
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/rel/*:refs/remotes/origin/rel/*'
          if [ -z "$(git branch -r --contains HEAD --list 'origin/master' 'origin/rel/*')" ]; then
            echo "::error::$(git rev-parse HEAD) is not on master or a rel/* branch"
            exit 1
          fi

      - name: Fail if tag already exists
        id: tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Release preflight
        id: preflight
        uses: ./.github/actions/release-preflight
        with:
          version: ${{ env.VERSION }}
          github-token: ${{ github.token }}
          skip-ci-check: ${{ inputs.skip_ci_check == true }}

      - name: Create or reuse draft release
        id: draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.preflight.outputs.sha }}
          EVENT_RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "release_url=$EVENT_RELEASE_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_JSON=$(gh release view "$VERSION" --json isDraft,url 2>/dev/null || echo "")

          if [ -n "$RELEASE_JSON" ]; then
            IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.isDraft')
            URL=$(echo "$RELEASE_JSON" | jq -r '.url')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $VERSION already exists and is published"
              exit 1
            fi
            echo "Reusing existing draft release: $URL"
          else
            PRERELEASE_FLAG=()
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE_FLAG=(--prerelease)
            fi
            URL=$(gh release create "$VERSION" --draft --generate-notes --target "$SHA" --title "$VERSION" "${PRERELEASE_FLAG[@]}")
            echo "Created draft release: $URL"
          fi

          echo "release_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write summary
        id: summary
        env:
          SHA: ${{ steps.preflight.outputs.sha }}
          RELEASE_URL: ${{ steps.draft.outputs.release_url }}
        run: |
          {
            echo "## Publish Release: $VERSION${{ inputs.dry_run && ' (dry run)' || '' }}"
            echo ""
            echo "- **Version:** \`$VERSION\`"
            echo "- **SHA:** \`$SHA\`"
            echo "- **Release:** $RELEASE_URL"
            if [ "${{ inputs.skip_ci_check == true }}" = "true" ]; then
              echo "- ⚠️ **CI check skipped:** pull_request CI for this commit was not verified"
            fi
            echo ""
            echo "Approve the \`npm\` environment on this run to publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout Slack action
        if: always()
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack release awaiting approval
        id: slack_pending
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: pending
          title: React Native SDK `${{ env.VERSION }}` awaiting approval${{ inputs.skip_ci_check && ' (CI check skipped)' || '' }}
          body: Approve the `npm` environment on this run to publish.
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ steps.preflight.outputs.short_sha }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.preflight.outputs.sha }}
            ${{ steps.draft.outputs.release_url && format('Release|{0}', steps.draft.outputs.release_url) || '' }}

      - name: Find failed step
        id: failed
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          step=$(jq -r '
            {
              checkout: "Checkout repository",
              branch: "Require a commit on master or rel/*",
              tag: "Fail if tag already exists",
              preflight: "Release preflight",
              draft: "Create or reuse draft release",
              summary: "Write summary"
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure")][0].key) as $key
            | if $key == null then "unknown step" else ($names[$key] // $key) end
          ' <<<"$STEPS_JSON")
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Notify Slack release failure
        id: slack_failure
        if: failure()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack_pending.outputs.ts }}
          status: failure
          title: React Native SDK `${{ env.VERSION }}` release failed
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ steps.preflight.outputs.short_sha }}`
            Stage: Preflight and draft
            Triggered by: `${{ env.TRIGGERED_BY }}`

      - name: Reply with failure details
        if: failure() && steps.slack_failure.outputs.ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack_failure.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.failed.outputs.step }}

  publish-sdk:
    needs: prepare
    uses: ./.github/workflows/publish-sdk.yml
    with:
      version: ${{ inputs.version || github.event.release.tag_name }}
      release_url: ${{ needs.prepare.outputs.release_url }}
      ref: ${{ needs.prepare.outputs.sha }}
      dry_run: ${{ inputs.dry_run == true }}
      slack_thread_ts: ${{ needs.prepare.outputs.slack_ts }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  finalize:
    needs: [prepare, publish-sdk]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      SLACK_TS: ${{ needs.prepare.outputs.slack_ts }}
    steps:
      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --draft=false --prerelease=true --latest=false --target "$SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$VERSION" --draft=false --prerelease=false --latest --target "$SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Dispatch publish-example
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PLATFORM=both
          # True when the workflow file at $VERSION declares the input named by $1.
          takes_input() {
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-example.yml?ref=$VERSION" \
              -H "Accept: application/vnd.github.raw" | grep -q "^[[:space:]]*$1:"
          }
          args=()
          if [ -n "$SLACK_TS" ] && takes_input slack_thread_ts; then
            args+=(-f "slack_thread_ts=$SLACK_TS")
          fi
          if takes_input triggered_by; then
            args+=(-f "triggered_by=$TRIGGERED_BY")
          fi
          gh workflow run publish-example.yml --ref "$VERSION" -f platform="$PLATFORM" --repo "$GITHUB_REPOSITORY" "${args[@]}"

      - name: Dispatch next release branch
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && !contains(env.VERSION, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rel-branch.yml --repo "$GITHUB_REPOSITORY" --ref master -f "base=$VERSION" -f "triggered_by=$TRIGGERED_BY"
          echo "Dispatched rel-branch.yml from $VERSION"

      - name: Write summary
        id: summary
        env:
          RELEASE_URL: ${{ needs.prepare.outputs.release_url }}
        run: |
          {
            echo "## Published: $VERSION"
            echo ""
            echo "- **Release:** $RELEASE_URL"
            echo "- **Example publish:** [publish-example.yml](${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish-example.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack release published
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ env.SLACK_TS }}
          status: success
          title: React Native SDK `${{ env.VERSION }}` published${{ contains(env.VERSION, '-') && ' (prerelease)' || '' }}
          body: Published to npm and released on GitHub. The example app deploy replies in this thread.
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.short_sha }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Release|${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.VERSION }}
            npm|https://www.npmjs.com/package/klaviyo-react-native-sdk/v/${{ env.VERSION }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

      - name: Find failed step
        id: failed
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          step=$(jq -r '
            {
              publish: "Publish release",
              dispatch: "Dispatch publish-example",
              summary: "Write summary"
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure")][0].key) as $key
            | if $key == null then "unknown step" else ($names[$key] // $key) end
          ' <<<"$STEPS_JSON")
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Notify Slack release failure
        id: slack_failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ env.SLACK_TS }}
          status: failure
          title: React Native SDK `${{ env.VERSION }}` release failed
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.short_sha }}`
            Stage: Finalize
            Triggered by: `${{ env.TRIGGERED_BY }}`

      - name: Reply with failure details
        if: failure() && steps.slack_failure.outputs.ts != ''
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ steps.slack_failure.outputs.ts }}
          status: failure
          title: Failed at ${{ steps.failed.outputs.step }}

  released:
    needs: [prepare, publish-sdk]
    if: github.event_name == 'release' && needs.publish-sdk.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Notify Slack release published
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ needs.prepare.outputs.slack_ts }}
          status: success
          title: React Native SDK `${{ env.VERSION }}` published to npm
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.short_sha }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
          links: |
            Release|${{ github.event.release.html_url }}
            npm|https://www.npmjs.com/package/klaviyo-react-native-sdk/v/${{ env.VERSION }}
            Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.prepare.outputs.sha }}

  # Rejected deployments and cancelled runs skip every failure() Slack step.
  stopped:
    needs: [prepare, publish-sdk, finalize]
    if: always() && !inputs.dry_run && (contains(needs.*.result, 'cancelled') || needs.publish-sdk.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Classify stop
        id: reason
        env:
          GH_TOKEN: ${{ github.token }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [ "$CANCELLED" = "true" ]; then
            echo "reason=cancelled or timed out" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rejected deployment fails the npm job before any step runs.
          ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '[.jobs[] | select(.name | endswith("/ publish-sdk")) | .steps | length] | add // 0')
          if [ "$ran" = "0" ]; then
            echo "reason=npm deploy rejected" >> "$GITHUB_OUTPUT"
          else
            echo "reason=npm publish failed" >> "$GITHUB_OUTPUT"
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Slack action
        if: steps.reason.outputs.reason != ''
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Notify Slack release stopped
        if: steps.reason.outputs.reason != ''
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ needs.prepare.outputs.slack_ts }}
          status: ${{ steps.reason.outputs.status || 'stopped' }}
          title: React Native SDK `${{ env.VERSION }}` release stopped, ${{ steps.reason.outputs.reason }}
          body: Nothing more will publish from this run.${{ steps.reason.outputs.status == 'failure' && ' Failure details are in this thread.' || '' }}
          fields: |
            Version: `${{ env.VERSION }}`
            Commit: `${{ needs.prepare.outputs.short_sha }}`
            Triggered by: `${{ env.TRIGGERED_BY }}`
