name: Release Branch Core

# Shared rel/X.Y.Z branch creation for every Klaviyo mobile SDK. Called from
# each SDK's rel-branch.yml with `secrets: inherit` (X_REPO_PAT, SLACK_BOT_TOKEN).
# Creates the branch from base with the bot version bump commit, opens its draft
# release PR into master, sends each wrapper a `native-rel-branch`
# repository_dispatch for its pin and posts to Slack. Does
# nothing when the branch already exists. See .github/shared/README.md.
on:
  workflow_call:
    inputs:
      bump:
        description: Which part of the latest stable version to increment (patch, minor, major)
        required: false
        default: minor
        type: string
      steps:
        description: How many increments past the latest stable release
        required: false
        default: 1
        type: number
      version:
        description: Explicit X.Y.Z, overrides bump and steps
        required: false
        default: ''
        type: string
      base:
        description: Branch, tag or sha to cut from
        required: false
        default: master
        type: string
      triggered_by:
        description: Person to credit in Slack when another workflow starts the caller
        required: false
        default: ''
        type: string
      sdk-name:
        description: SDK name used in Slack titles, e.g. React Native SDK
        required: true
        type: string
      slack-username:
        description: Slack bot display name for new posts
        required: false
        default: ''
        type: string
      slack-icon-emoji:
        description: Slack bot avatar emoji for new posts
        required: false
        default: ''
        type: string
      bump-command:
        description: Bash run from the repo root to bump the version. VERSION holds the target X.Y.Z. It must change tracked files.
        required: true
        type: string
      node-version-file:
        description: When set, sets up Node.js from this file before the bump
        required: false
        default: ''
        type: string
      dispatch-input:
        description: client_payload key each dispatch target's rel-branch.yml reads for this SDK's branch (e.g. android, ios, react_native)
        required: false
        default: ''
        type: string
      dispatch-targets:
        description: Space-separated klaviyo/<repo> names sent a native-rel-branch repository_dispatch with dispatch-input=<new branch> on the default next-minor train. Empty dispatches nothing.
        required: false
        default: ''
        type: string
      dispatch-label:
        description: How the dispatched targets read in Slack, e.g. `React Native`, `Flutter`
        required: false
        default: ''
        type: string
      release-pr-base:
        description: Branch the release PR targets
        required: false
        default: master
        type: string
      runs-on:
        description: Runner label
        required: false
        default: ubuntu-latest
        type: string
    outputs:
      version:
        description: The new X.Y.Z
        value: ${{ jobs.rel_branch.outputs.version }}
      branch:
        description: rel/<version>
        value: ${{ jobs.rel_branch.outputs.branch }}
      created:
        description: "'true' when this run created the branch"
        value: ${{ jobs.rel_branch.outputs.created }}
      pr_url:
        description: URL of the release PR
        value: ${{ jobs.rel_branch.outputs.pr_url }}
      triggered_by:
        description: Person credited in Slack
        value: ${{ jobs.rel_branch.outputs.triggered_by }}

jobs:
  rel_branch:
    name: Create release branch
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      SLACK_USERNAME: ${{ inputs.slack-username }}
      SLACK_ICON_EMOJI: ${{ inputs.slack-icon-emoji }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898333+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898333+github-actions[bot]@users.noreply.github.com
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      branch: ${{ steps.resolve.outputs.branch }}
      created: ${{ steps.push.outputs.created }}
      pr_url: ${{ steps.pr.outputs.url }}
      triggered_by: ${{ steps.trigger.outputs.value }}
    steps:
      - name: Check out base
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base || 'master' }}
          fetch-depth: 0

      - name: Set up Node.js
        if: inputs.node-version-file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
          STEPS: ${{ github.event_name != 'workflow_dispatch' && 1 || inputs.steps }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.base || 'master' }}
        run: |
          set -euo pipefail

          if [ -n "$EXPLICIT_VERSION" ]; then
            if ! [[ "$EXPLICIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like X.Y.Z, got '$EXPLICIT_VERSION'"
              exit 1
            fi
            version=$EXPLICIT_VERSION
          else
            if ! [[ "$STEPS" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::steps must be a positive integer, got '$STEPS'"
              exit 1
            fi
            latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ -z "$latest" ]; then
              echo "::error::No stable X.Y.Z tag found"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + STEPS)); minor=0; patch=0 ;;
              minor) minor=$((minor + STEPS)); patch=0 ;;
              patch) patch=$((patch + STEPS)) ;;
              *) echo "::error::bump must be patch, minor or major, got '$BUMP'"; exit 1 ;;
            esac
            version="$major.$minor.$patch"
            echo "Latest stable release is $latest"
          fi

          echo "Target version $version from $BASE"
          {
            echo "version=$version"
            echo "branch=rel/$version"
            echo "short_sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve trigger
        id: trigger
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TRIGGERED_BY: ${{ inputs.triggered_by }}
          ACTOR: ${{ github.triggering_actor || github.actor }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = schedule ]; then
            value=schedule
          elif [ -n "$INPUT_TRIGGERED_BY" ]; then
            value=$INPUT_TRIGGERED_BY
          elif [[ "$ACTOR" == *"[bot]" ]]; then
            value="Release Branch (automation)"
          else
            value=$ACTOR
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Create branch
        id: push
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          BUMP_COMMAND: ${{ inputs.bump-command }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            echo "$BRANCH already exists on origin, nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bash -euo pipefail -c "$BUMP_COMMAND"

          if git diff --quiet; then
            echo "::error::The version bump changed nothing"
            exit 1
          fi

          git diff --stat
          git commit -a -m "rel: bump version to $VERSION"

          if git push --force-with-lease="refs/heads/$BRANCH:" origin "HEAD:refs/heads/$BRANCH"; then
            echo "Created $BRANCH"
            echo "created=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" > /dev/null; then
            echo "$BRANCH was created by another run, nothing to do"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Push of $BRANCH was rejected"
            exit 1
          fi

      - name: Open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          PR_BASE: ${{ inputs.release-pr-base }}
          STEPS: ${{ github.event_name != 'workflow_dispatch' && 1 || inputs.steps }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          IFS=. read -r _ minor patch <<< "$VERSION"
          if [ "$patch" != 0 ]; then
            label="patch-release"
          elif [ "$minor" != 0 ]; then
            label="minor-release"
          else
            label="major-release"
          fi
          if ! gh label list --repo "$GITHUB_REPOSITORY" --search "$label" --json name --jq '.[].name' | grep -qx "$label"; then
            gh label create "$label" --repo "$GITHUB_REPOSITORY"
          fi

          url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$PR_BASE" --state open --json url --jq '.[0].url // empty')
          if [ -n "$url" ]; then
            echo "$BRANCH already has a PR: $url"
            gh pr edit "$url" --add-label "$label"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$PR_BASE...$BRANCH" --jq .ahead_by)" = 0 ]; then
            echo "::error::$BRANCH has no commits ahead of $PR_BASE, so GitHub can't open its release PR. Add the version bump to $BRANCH."
            exit 1
          fi

          assignee=()
          if [[ "$ACTOR" != *"[bot]" ]]; then
            assignee=(--assignee "$ACTOR")
          fi

          ship_day() {
            local d
            d=$(date -u -d "$1-01 +1 month -1 day" +%F)
            while [ "$(date -u -d "$d" +%u)" -gt 5 ]; do d=$(date -u -d "$d -1 day" +%F); done
            echo "$d"
          }
          test_start() {
            local d n=1
            d=$(ship_day "$1")
            while [ "$n" -lt 5 ]; do
              d=$(date -u -d "$d -1 day" +%F)
              [ "$(date -u -d "$d" +%u)" -le 5 ] && n=$((n + 1))
            done
            echo "$d"
          }
          title="rel: $VERSION"
          if [ "$patch" = 0 ]; then
            month=$(date -u +%Y-%m)
            if [[ ! "$(date -u +%F)" < "$(test_start "$month")" ]]; then
              month=$(date -u -d "$month-01 +1 month" +%Y-%m)
            fi
            extra=0
            if [ -z "$EXPLICIT_VERSION" ]; then extra=$((STEPS - 1)); fi
            month=$(date -u -d "$month-01 +$extra month" +%Y-%m)
            title="rel: $VERSION (slated for $(date -u -d "$month-01" +%B))"
          fi

          # shellcheck disable=SC2016
          body=$(printf 'Release PR for `%s`. Feature PRs for this release target `%s`. Merge this after `%s` is published.\n\nOpened by [Release Branch](%s).' "$VERSION" "$BRANCH" "$VERSION" "$RUN_URL")
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$PR_BASE" --head "$BRANCH" "${assignee[@]}" --title "$title" --label "$label" --body "$body")
          echo "Opened $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Dispatch native pin to wrapper SDKs
        id: dispatch
        if: steps.push.outputs.created == 'true' && inputs.dispatch-targets != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.X_REPO_PAT }}
          NATIVE_INPUT: ${{ inputs.dispatch-input }}
          TARGETS: ${{ inputs.dispatch-targets }}
          VERSION: ${{ steps.resolve.outputs.version }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          TRIGGERED_BY: ${{ steps.trigger.outputs.value }}
          DEFAULT_TRAIN: ${{ github.event_name != 'workflow_dispatch' || (inputs.bump == 'minor' && inputs.steps == 1 && inputs.version == '') }}
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping prerelease $VERSION"
            exit 0
          fi
          if [ "$DEFAULT_TRAIN" != true ]; then
            echo "::notice::$BRANCH isn't the next-minor train, so wrapper pins aren't dispatched. Pin each wrapper's matching train by hand."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NATIVE_INPUT" ]; then
            echo "::error::dispatch-targets is set but dispatch-input is empty"
            exit 1
          fi

          failed=0
          for wrapper in $TARGETS; do
            payload=$(jq -n --arg key "$NATIVE_INPUT" --arg branch "$BRANCH" --arg triggered_by "$TRIGGERED_BY" '{event_type: "native-rel-branch", client_payload: {($key): $branch, triggered_by: $triggered_by}}')
            if printf '%s' "$payload" | gh api --method POST "repos/klaviyo/$wrapper/dispatches" --input -; then
              echo "Dispatched $wrapper"
            else
              echo "::warning::Could not dispatch $wrapper"
              failed=1
            fi
          done
          exit "$failed"

      - name: Notify Slack of new release branch
        if: success() && steps.push.outputs.created == 'true'
        timeout-minutes: 2
        continue-on-error: true
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/notify-slack@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: success
          title: ${{ inputs.sdk-name }} release branch `${{ steps.resolve.outputs.branch }}` created from `${{ inputs.base || 'master' }}`
          fields: |
            Version: `${{ steps.resolve.outputs.version }}`
            Base: `${{ inputs.base || 'master' }}`
            Trigger: `${{ github.event_name }}`
            Triggered by: `${{ steps.trigger.outputs.value }}`
            ${{ inputs.dispatch-targets != '' && format('Wrappers: {0}', steps.dispatch.outputs.skipped == 'true' && 'not dispatched, not the next-minor train' || (steps.dispatch.outcome == 'success' && format('{0} dispatched', inputs.dispatch-label || inputs.dispatch-targets) || 'dispatch failed, pin by hand')) || '' }}
          links: |
            Branch|${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.resolve.outputs.branch }}
            Pull request|${{ steps.pr.outputs.url }}

      - name: Notify Slack of failure
        if: failure()
        timeout-minutes: 2
        continue-on-error: true
        uses: klaviyo/klaviyo-react-native-sdk/.github/shared/notify-slack@master
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: failure
          title: ${{ steps.resolve.outputs.branch && format('{0} release branch `{1}` could not be created', inputs.sdk-name, steps.resolve.outputs.branch) || format('{0} release branch could not be created', inputs.sdk-name) }}
          fields: |
            Base: `${{ inputs.base || 'master' }}`
            Trigger: `${{ github.event_name }}`
            Triggered by: `${{ steps.trigger.outputs.value || github.triggering_actor || github.actor }}`
