name: Publish SDK to NPM

on:
  release:
    types: [published]

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: Release preflight
        uses: ./.github/actions/release-preflight
        with:
          version: ${{ github.event.release.tag_name }}
          github-token: ${{ github.token }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          title: RN SDK
          platform: npm (preflight)
          version_label: ${{ github.event.release.tag_name }}
          release_url: ${{ github.event.release.html_url }}

  publish-sdk:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        uses: ./.github/actions/setup

      # Explicit `yarn prepare` IS load-bearing — do not remove without
      # rewiring the publish path. Two reasons:
      #   1. Yarn Berry 3 does not run the `prepare` lifecycle hook (yarn
      #      manifest docs only list preinstall/install/postinstall/
      #      prepack/postpack), so `yarn install` above does NOT build `lib/`.
      #   2. JS-DevTools/npm-publish defaults to `--ignore-scripts` as a
      #      security precaution, so `npm publish` does NOT run `prepare`
      #      either. Setting `ignore-scripts: false` would let it, but
      #      explicit-build-then-publish is clearer and matches local dev.
      # Without this step, `lib/` is empty when the tarball gets uploaded
      # and every consumer's `import 'klaviyo-react-native-sdk'` breaks.
      - name: Prepare
        run: yarn prepare

      - id: publish
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_TOKEN }}
          tag: ${{ steps.pkg.outputs.dist_tag }}

      - name: Verify version on npm
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            published="$(npm view "klaviyo-react-native-sdk@${VERSION}" version --fetch-timeout=10000 --fetch-retries=0 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ]; then
              echo "klaviyo-react-native-sdk@${VERSION} is live on npm"
              exit 0
            fi
            echo "Attempt ${attempt}/20: ${VERSION} not visible on npm yet, retrying in 15s"
            sleep 15
          done
          echo "::error::klaviyo-react-native-sdk@${VERSION} did not appear on npm after 5 minutes"
          exit 1

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          title: RN SDK
          platform: npm
          version_label: ${{ steps.publish.outputs.type != '' && format('{0} (npm dist-tag {1})', steps.pkg.outputs.version, steps.pkg.outputs.dist_tag) || format('{0} (already on npm, nothing published)', steps.pkg.outputs.version) }}
          release_url: ${{ github.event.release.html_url }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          title: RN SDK
          platform: npm
          version_label: ${{ steps.pkg.outputs.version || github.event.release.tag_name }}
          release_url: ${{ github.event.release.html_url }}
