name: Publish SDK to NPM

# Called only by publish-release.yml, which runs the release preflight and is
# the workflow the npm trusted publisher names.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish (X.Y.Z tag)'
        required: true
        type: string
      release_url:
        description: 'GitHub release URL'
        required: true
        type: string
      ref:
        description: 'Commit SHA or ref to check out when the tag does not exist yet'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run npm publish --dry-run and skip the success alert'
        required: false
        default: false
        type: boolean
      slack_thread_ts:
        description: 'Slack message ts to reply under; leave empty to post a new message'
        required: false
        default: ''
        type: string

env:
  SLACK_USERNAME: React Native SDK
  SLACK_ICON_EMOJI: ':merlin-orb-react-native:'

jobs:
  publish-sdk:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Compute short commit
        id: commit
        env:
          REF: ${{ inputs.ref || inputs.version }}
        run: |
          short=$REF
          if [[ "$short" =~ ^[0-9a-f]{40}$ ]]; then
            echo "link=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$short" >> "$GITHUB_OUTPUT"
            short=${short:0:7}
          fi
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.version }}

      - name: Checkout Slack action
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          persist-credentials: false
          path: _slack

      - name: Notify Slack npm publish started
        id: slack
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: pending
          title: React Native SDK `${{ inputs.version }}` publishing to npm
          fields: |
            Version: `${{ inputs.version }}`
            Commit: `${{ steps.commit.outputs.short }}`
          links: ${{ steps.commit.outputs.link && format('Commit|{0}', steps.commit.outputs.link) || '' }}

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      # Explicit `yarn prepare` builds lib/ before the stage. Yarn Berry 3
      # does not run the `prepare` lifecycle hook on install, and
      # `npm stage publish` packs the working directory without running it
      # either. Without this step the staged tarball has an empty lib/ and
      # every consumer's `import 'klaviyo-react-native-sdk'` breaks.
      - name: Prepare
        id: prepare
        run: yarn prepare

      # Trusted publishing (OIDC): npm exchanges this job's OIDC token for
      # a short-lived credential, so there is no NPM_TOKEN secret to rotate.
      # Requires Node >= 22.14, npm >= 11.15 and a trust relationship on
      # npmjs.com; provenance attestation is included.
      - name: Setup Node for trusted publishing
        id: node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.14'

      - name: Update npm for trusted publishing
        id: npm
        run: npm install -g "npm@^11.15.0"

      - name: Publish to npm (dry run)
        id: publish_dry_run
        if: inputs.dry_run
        run: npm publish --dry-run --tag "${{ steps.pkg.outputs.dist_tag }}"

      - name: Publish to npm
        id: publish
        if: ${{ !inputs.dry_run }}
        run: |
          if npm publish --tag "${{ steps.pkg.outputs.dist_tag }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ "$(npm view "klaviyo-react-native-sdk@${{ steps.pkg.outputs.version }}" version --fetch-timeout=10000 --fetch-retries=0 2>/dev/null)" = "${{ steps.pkg.outputs.version }}" ]; then
            echo "::warning::klaviyo-react-native-sdk@${{ steps.pkg.outputs.version }} is already on npm, nothing to do"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Notify Slack on success
        if: success() && !inputs.dry_run
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack.outputs.ts }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: success
          title: React Native SDK `${{ steps.pkg.outputs.version }}` ${{ steps.publish.outputs.already_published == 'true' && 'already on npm, nothing to do' || 'published to npm' }}
          fields: |
            Version: `${{ steps.pkg.outputs.version }}`
            Dist-tag: `${{ steps.pkg.outputs.dist_tag }}`
          links: npm|https://www.npmjs.com/package/klaviyo-react-native-sdk/v/${{ steps.pkg.outputs.version }}

      - name: Classify cancellation
        id: stop
        if: cancelled()
        env:
          TIMEOUT_MINUTES: 360
        run: |
          elapsed=$(( $(date +%s) - ${JOB_START:-$(date +%s)} ))
          if [ "$elapsed" -ge $(( TIMEOUT_MINUTES * 60 - 60 )) ]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find failed step
        id: failed
        if: failure() || cancelled()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          step=$(jq -r '
            {
              checkout: "Checkout repository",
              pkg: "Read package version",
              setup: "Setup",
              prepare: "Prepare",
              node: "Setup Node for trusted publishing",
              npm: "Update npm for trusted publishing",
              publish_dry_run: "Publish to npm (dry run)",
              publish: "Publish to npm"
            } as $names
            | ([to_entries[] | select(.value.conclusion == "failure" or .value.conclusion == "cancelled")][0].key) as $key
            | if $key == null then "unknown step" else ($names[$key] // $key) end
          ' <<<"$STEPS_JSON")
          echo "step=$step" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        if: failure() || (cancelled() && steps.stop.outputs.timed_out == 'true')
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          ts: ${{ steps.slack.outputs.ts }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: ${{ job.status == 'cancelled' && 'stopped' || 'failure' }}
          title: React Native SDK `${{ steps.pkg.outputs.version || inputs.version }}` npm publish ${{ job.status == 'cancelled' && 'timed out' || 'failed' }} at ${{ steps.failed.outputs.step }}
          fields: |
            Version: `${{ steps.pkg.outputs.version || inputs.version }}`
            Commit: `${{ steps.commit.outputs.short }}`
          links: ${{ steps.commit.outputs.link && format('Commit|{0}', steps.commit.outputs.link) || '' }}

  linear-release:
    needs: publish-sdk
    if: ${{ !inputs.dry_run && !contains(inputs.version, '-') && github.event.release.prerelease != true }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Sync release to Linear
        id: linear-sync
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ needs.publish-sdk.outputs.version }}
          name: ${{ needs.publish-sdk.outputs.version }}

      - name: Complete release in Linear
        if: steps.linear-sync.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ needs.publish-sdk.outputs.version }}
