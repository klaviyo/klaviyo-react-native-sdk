name: Publish SDK to NPM

on:
  release:
    types: [published]

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: Release preflight
        uses: ./.github/actions/release-preflight
        with:
          version: ${{ github.event.release.tag_name }}
          github-token: ${{ github.token }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          title: RN SDK
          platform: npm (preflight)
          version_label: ${{ github.event.release.tag_name }}
          release_url: ${{ github.event.release.html_url }}

  publish-sdk:
    needs: preflight
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup
        uses: ./.github/actions/setup

      # Explicit `yarn prepare` builds lib/ before the stage. Yarn Berry 3
      # does not run the `prepare` lifecycle hook on install, and
      # `npm stage publish` packs the working directory without running it
      # either. Without this step the staged tarball has an empty lib/ and
      # every consumer's `import 'klaviyo-react-native-sdk'` breaks.
      - name: Prepare
        run: yarn prepare

      # npm stage publish packs and stages without a 2FA prompt; a
      # maintainer promotes the staged version later with
      # `npm stage approve <stage-id>` (2FA required).
      - name: Update npm for staged publishing
        run: npm install -g npm@latest

      - name: Stage on npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          if npm stage publish --tag "${{ steps.pkg.outputs.dist_tag }}" --json > stage-result.json; then
            echo "stage_id=$(jq -r '.[0].stageId // empty' stage-result.json)" >> "$GITHUB_OUTPUT"
          else
            if npm stage list klaviyo-react-native-sdk --json 2>/dev/null | jq -e --arg v "${{ steps.pkg.outputs.version }}" 'any(.[]; .version == $v)' > /dev/null; then
              echo "::warning::klaviyo-react-native-sdk@${{ steps.pkg.outputs.version }} is already staged on npm, nothing to do"
              echo "already_staged=true" >> "$GITHUB_OUTPUT"
            else
              cat stage-result.json
              exit 1
            fi
          fi

      - name: Verify staged version
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          for attempt in $(seq 1 10); do
            if npm stage list klaviyo-react-native-sdk --json 2>/dev/null | jq -e --arg v "$VERSION" 'any(.[]; .version == $v)' > /dev/null; then
              echo "klaviyo-react-native-sdk@${VERSION} is staged on npm"
              exit 0
            fi
            echo "Attempt ${attempt}/10: ${VERSION} not staged yet, retrying in 15s"
            sleep 15
          done
          echo "::error::klaviyo-react-native-sdk@${VERSION} did not appear as staged on npm"
          exit 1

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          title: RN SDK
          platform: npm
          headline: "${{ steps.publish.outputs.already_staged == 'true' && format('✅ RN SDK: npm {0} already staged, nothing to do', steps.pkg.outputs.version) || format('📦 RN SDK: npm {0} staged — maintainer approval required (2FA)', steps.pkg.outputs.version) }}"
          version_label: "${{ format('{0} (npm dist-tag {1})', steps.pkg.outputs.version, steps.pkg.outputs.dist_tag) }}${{ steps.publish.outputs.stage_id != '' && format(' — stage id `{0}`', steps.publish.outputs.stage_id) || '' }}"
          release_url: ${{ github.event.release.html_url }}

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          title: RN SDK
          platform: npm
          version_label: ${{ steps.pkg.outputs.version || github.event.release.tag_name }}
          release_url: ${{ github.event.release.html_url }}
