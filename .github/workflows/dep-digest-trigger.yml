# Asks Reca for the morning Dependabot digest across all seven MAGE repos.
# Posts one plain-text Slack message as Merlin that mentions Reca; Reca runs
# /mage:dep-digest slack and replies in the thread. Triage logic lives in the
# MAGE plugin, not here. This workflow only posts the trigger.
#
# It calls chat.postMessage directly instead of notify-slack, because
# notify-slack always sets a custom username (MAGE CI by default) and sends
# blocks. This posts as the Merlin app itself, with plain text.
name: Dependabot digest trigger

on:
  workflow_dispatch:
  # TEST ONLY: remove before opening the real PR.
  push:
    branches: [test/dep-digest-trigger]
  # Enable after the Merlin -> Reca test passes. Cron is UTC:
  # 12:30 UTC = 7:30 ET in winter (EST), 8:30 ET in summer (EDT).
  # schedule:
  #   - cron: '30 12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: dep-digest-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask Reca for the digest
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # #mobile-app-growth-dependabot-reviews
          CHANNEL: C0CB8HD3FQF
          # Reca
          TEXT: '<@U09DA0L0H1B> run `/mage:dep-digest slack`'
        run: |
          payload=$(jq -n --arg c "$CHANNEL" --arg t "$TEXT" '{channel: $c, text: $t}')
          resp=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")
          if [ "$(jq -r .ok <<<"$resp")" != "true" ]; then
            echo "::error::Slack post failed: $(jq -r .error <<<"$resp")"
            exit 1
          fi
          echo "Posted ts=$(jq -r .ts <<<"$resp")"
