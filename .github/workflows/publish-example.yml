# Publish the example app to Play internal track + TestFlight. Android and
# iOS are independent jobs.
#
# Triggers:
#   - workflow_dispatch     (manual or tag-dispatch from publish-release.yml;
#                           choose `both` / `android` / `ios`)
#   - release: published    (both platforms)
#   - push to master/rel/** (both platforms)
#   - pull_request: labeled (label drives platform selection — see below)
#
# Label conventions (cleanup-label removes them after the run so reapplying
# re-triggers):
#   - `deploy-example-app`         → both platforms
#   - `deploy-example-app:android` → Android only
#   - `deploy-example-app:ios`     → iOS only
#
# Releases publish once, from the tag. A master push whose tree matches the
# current release tag skips its deploys, and a release run cancels in-flight
# master push runs it already contains. See release-merge-check and
# supersede-push-runs.
#
# Build numbers: Android versionCode is globally monotonic (highest on Play
# + 1); iOS build numbers restart at 1 per marketing version and strictly
# increase within it. Deploys queue per platform across all runs. Each job
# preflights the store, then retries with a fresh number if the upload is
# rejected for a conflict.
#
# App version: X.Y.Z from the SDK version on a release, X.Y.Z-rc.<build> on
# rel/*, X.Y.Z-alpha.<build> otherwise. Android versionName carries the full
# string; iOS CFBundleShortVersionString stays X.Y.Z and the full string goes
# in the KlaviyoAppVersion Info.plist key.
#
# Deploys run only after the `checks` job (ci.yml: lint, unit tests, library
# build) passes in the same run, on every trigger including the PR-label one.
#
# This repo is public, so its Actions logs are too. Never surface a public
# install link (e.g. a TestFlight public-link `testflight.apple.com/join/...`)
# here; only links that require a Play/App Store Connect login. The Android
# Slack link is the per-build Play URL
# (play.google.com/apps/test/<package>/<versionCode>), which only an internal
# tester can open. It is not set as the android-internal-track environment URL,
# which the public Deployments page would show.

name: Publish Example App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to publish'
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
  release:
    types: [published]
  push:
    branches: [master, 'rel/**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
      - '.coderabbit.yaml'
      - '.cursor/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'src/__tests__/**'
      - 'example/jest.config.js'
      - 'lefthook.yml'
  pull_request:
    types: [labeled]

# A newer push to the same branch cancels the run in flight. Release, manual
# and PR-label runs are never cancelled by this group. Deploy jobs also queue
# per platform (see deploy-android's concurrency).
concurrency:
  group: publish-example-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

# Shared event fields for every step that stamps build info or renders
# notes/Slack, so the app, the store notes and the Slack message can never
# disagree about the commit, branch or trigger. On pull_request events
# github.sha is the synthetic merge commit and github.ref_name is
# "123/merge", so both prefer the PR head.
env:
  EVENT_NAME: ${{ github.event_name }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  HEAD_REF: ${{ github.head_ref }}
  REF_NAME: ${{ github.ref_name }}
  REF_TYPE: ${{ github.ref_type }}

jobs:
  # On a push to master, sets skip=true when HEAD's tree matches the tag of
  # package.json's version (a rel/* merge-back). The release run publishes
  # that content from the tag. The skip applies whether or not the release
  # run's publish succeeded; retry a failed release publish from the release
  # run. A missing tag or failed lookup leaves skip=false.
  release-merge-check:
    name: Check for release merge-back
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Compare HEAD with the release tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          if ! git fetch --quiet --depth=1 origin "refs/tags/$VERSION:refs/tags/$VERSION" 2>/dev/null; then
            echo "No tag $VERSION; deploying."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_TREE=$(git rev-parse 'HEAD^{tree}')
          TAG_TREE=$(git rev-parse "$VERSION^{tree}")
          if [ "$HEAD_TREE" = "$TAG_TREE" ]; then
            echo "::notice::HEAD has the same tree as release tag $VERSION, which the release run publishes. Skipping this deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "HEAD differs from release tag $VERSION; deploying."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # On a release or tag-dispatched run that publishes both platforms, cancels
  # in-flight master push runs of this workflow whose commit the release
  # contains (same commit, an ancestor, or the same tree). Only master push
  # runs are considered. It can cancel a run that is mid-upload; the deploy
  # jobs' per-platform queue then starts this run's deploy afterwards.
  supersede-push-runs:
    name: Cancel superseded master publishes
    if: |
      github.event_name == 'release'
      || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && inputs.platform == 'both')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel master publishes this release contains
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RELEASE_TREE=$(gh api "repos/$REPO/commits/$RELEASE_SHA" --jq .commit.tree.sha)
          gh api "repos/$REPO/actions/workflows/publish-example.yml/runs?event=push&branch=master&per_page=30" \
            --jq '.workflow_runs[] | select(.status != "completed") | "\(.id) \(.head_sha)"' |
          while read -r RUN_ID RUN_SHA; do
            RUN_TREE=$(gh api "repos/$REPO/commits/$RUN_SHA" --jq .commit.tree.sha)
            # compare/<base>...<head> is "ahead" or "identical" when head contains base.
            STATUS=$(gh api "repos/$REPO/compare/$RUN_SHA...$RELEASE_SHA" --jq .status)
            if [ "$RUN_TREE" = "$RELEASE_TREE" ] || [ "$STATUS" = "ahead" ] || [ "$STATUS" = "identical" ]; then
              echo "::notice::Cancelling master publish run $RUN_ID ($RUN_SHA); this release run publishes its content."
              if ! gh run cancel "$RUN_ID" --repo "$REPO"; then
                RUN_STATUS=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)
                if [ "$RUN_STATUS" != "completed" ]; then
                  echo "::error::Could not cancel run $RUN_ID (status $RUN_STATUS)."
                  exit 1
                fi
                echo "Run $RUN_ID finished before it could be cancelled."
              fi
            else
              echo "Keeping run $RUN_ID ($RUN_SHA): it has changes the release does not."
            fi
          done

  # Only run for triggers that can deploy: any other PR label must not start
  # the full macOS CI. Waits for the two jobs above. Runs when they are
  # skipped; a failed or timed-out supersede-push-runs stops the release
  # deploy, and a failed release-merge-check leaves skip unset so the push
  # deploys.
  checks:
    name: Lint, test and build the library
    needs: [release-merge-check, supersede-push-runs]
    if: |
      !cancelled()
      && (needs.supersede-push-runs.result == 'success' || needs.supersede-push-runs.result == 'skipped')
      && needs.release-merge-check.outputs.skip != 'true'
      && (github.event_name == 'release'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.label.name, 'deploy-example-app')))
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Verifies the platform's required secrets exist before a deploy runs.
  # Environment secrets are not visible here (no environment: is declared),
  # so the store secrets must be repository secrets. Missing secrets skip the
  # deploy on push/release (ready=false, green) and fail on
  # workflow_dispatch / label deploys.
  preflight-android:
    name: Check Android deploy secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: release-merge-check
    outputs:
      ready: ${{ steps.check.outputs.android_ready }}
      missing: ${{ steps.check.outputs.android_missing }}
    if: |
      !cancelled()
      && needs.release-merge-check.outputs.skip != 'true'
      && (github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'android'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:android')))
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check secrets
        id: check
        shell: bash
        env:
          KLAVIYO_EXAMPLE_API_KEY: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: .github/scripts/check-secrets.sh android

  preflight-ios:
    name: Check iOS deploy secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    needs: release-merge-check
    outputs:
      ready: ${{ steps.check.outputs.ios_ready }}
      missing: ${{ steps.check.outputs.ios_missing }}
    if: |
      !cancelled()
      && needs.release-merge-check.outputs.skip != 'true'
      && (github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios')))
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check secrets
        id: check
        shell: bash
        env:
          KLAVIYO_EXAMPLE_API_KEY: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/check-secrets.sh ios

  deploy-android:
    name: Publish to Play Store internal track
    needs: [checks, preflight-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: android-internal-track
    # One deploy per platform at a time across every run. Waiting deploys
    # queue FIFO (up to 100) and a started deploy is never cancelled by this
    # group. Same setup as klaviyo-flutter-sdk's publish-example.yml.
    concurrency:
      group: publish-example-android
      cancel-in-progress: false
      queue: max
    # Run on release / push always; on workflow_dispatch when platform is
    # `both` or `android`; on labeled PR when the label is `deploy-example-app`
    # (umbrella) or `deploy-example-app:android`. Skipped (not failed) when the
    # preflight found missing secrets on a push/release trigger.
    if: |
      !cancelled()
      && needs.checks.result == 'success'
      && (github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'android'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:android')))
      && needs.preflight-android.outputs.ready == 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prep example app
        uses: ./.github/actions/example-publish-prep
        with:
          api_key: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}

      # bundleRelease invokes Metro via the RN Gradle plugin; node + yarn must be on PATH.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: jdk

      - name: Add Google Services from Secrets
        run: 'echo "$GOOGLE_SERVICES_JSON" > ./example/android/app/google-services.json'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode upload keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/upload.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Builds the example app against the SDK as `npm install`-ed from a
      # tarball, not the workspace symlink. See pack-and-test.sh.
      - name: Pack SDK + flip example to packed install
        id: pack_sdk
        shell: bash
        run: ./pack-and-test.sh setup

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        shell: bash
        run: gem install -g .github/pins/fastlane/Gemfile --no-document

      # The android release lane picks the next versionCode from the Play
      # internal track, derives the versionName from it, builds and signs the
      # bundle, and uploads it, rebuilding with a fresh code and name when the
      # upload is rejected for a conflict.
      - name: Build & deploy to Internal Track
        id: build_and_deploy
        working-directory: example
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI: true
        run: fastlane android release

      # Composed after the upload so the notes carry the versionCode that
      # actually shipped. 500 chars is Google's per-locale cap.
      - name: Prepare release notes
        id: release_notes
        uses: ./.github/actions/example-release-notes
        with:
          max_length: 500
          platform: android

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"

      - name: Clean up google-services.json and example/.env
        if: always()
        shell: bash
        run: rm -f example/android/app/google-services.json example/.env

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: Android
          store: Play internal
          full_version: ${{ env.VERSION_NAME }}
          build: ${{ env.VERSION_CODE }}
          sdks: ${{ steps.release_notes.outputs.sdks }}
          install_url: https://play.google.com/apps/test/com.klaviyoreactnativesdkexample/${{ env.VERSION_CODE }}
          install_label: Install Klaviyo React Native SDK Example from Google Play
          install_fallback: Open the Play Store with an internal-tester Google account to install

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          steps_json: ${{ toJSON(steps) }}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: Android
          store: Play internal
          full_version: ${{ env.VERSION_NAME }}
          build: ${{ env.VERSION_CODE }}

  deploy-ios:
    name: Publish to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: testflight
      url: ${{ steps.result.outputs.testflight_url }}
    # See deploy-android's concurrency.
    concurrency:
      group: publish-example-ios
      cancel-in-progress: false
      queue: max
    needs: [checks, preflight-ios]
    outputs:
      marketing_version: ${{ steps.result.outputs.marketing_version }}
      full_version: ${{ steps.result.outputs.full_version }}
      build_number: ${{ steps.result.outputs.build_number }}
      app_id: ${{ steps.result.outputs.app_id }}
      notes: ${{ steps.result.outputs.notes }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    # Run on release / push always; on workflow_dispatch when platform is
    # `both` or `ios`; on labeled PR when the label is `deploy-example-app`
    # (umbrella) or `deploy-example-app:ios`. Skipped (not failed) when the
    # preflight found missing secrets on a push/release trigger.
    if: |
      !cancelled()
      && needs.checks.result == 'success'
      && (github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios')))
      && needs.preflight-ios.outputs.ready == 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prep example app
        uses: ./.github/actions/example-publish-prep
        with:
          api_key: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}

      # The RN Xcode build phase invokes Metro during archive; node + yarn must be on PATH.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          # ruby-version is read from example/.ruby-version. bundler-cache:true
          # also runs `bundle install --frozen` against example/Gemfile, so
          # any Gemfile / Gemfile.lock drift fails this step early.
          working-directory: example
          bundler-cache: true

      # setup-ruby switches the job to the example's pinned Ruby, which hides the
      # runner's preinstalled fastlane and doesn't have it as a gem. Install it
      # explicitly into the active Ruby so `fastlane` resolves deterministically.
      # Kept out of example/Gemfile to avoid bloating the CocoaPods-only bundle.
      - name: Install fastlane
        shell: bash
        run: gem install -g .github/pins/fastlane/Gemfile --no-document

      # Real GoogleService-Info.plist (com.klaviyoreactnativesdkexample) so
      # push delivery works against the published build.
      - name: Inject GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        shell: bash
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > example/ios/GoogleService-Info.plist

      # See ios-build.yml's Cache Pods step for the cache-key rationale.
      - name: Cache Pods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-publish-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock', 'example/.ruby-version', '*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-publish-

      # Builds the example app against the SDK as `npm install`-ed from a
      # tarball, not the workspace symlink. See pack-and-test.sh. Must run
      # before "Install CocoaPods dependencies" so pod install picks up the
      # packed-mode resolution.
      - name: Pack SDK + flip example to packed install
        shell: bash
        run: ./pack-and-test.sh setup

      # --repo-update so stale CDN caches can't pin us to old versions.
      # Delete .xcode.env.local so the Xcode build phase falls back to
      # `command -v node` (resolves to the setup-node binary on $PATH).
      # RCT_NEW_ARCH_ENABLED=1 is required for new-arch codegen to run
      # during pod install — otherwise xcodebuild fails on missing headers
      # like RCTAppDependencyProvider.h. With pack-and-test having flipped
      # the marker above, this pod install runs in packed mode.
      - name: Install CocoaPods dependencies
        id: pod_install
        working-directory: example/ios
        shell: bash
        env:
          RCT_NEW_ARCH_ENABLED: '1'
        run: |
          bundle exec pod install --repo-update
          rm -f .xcode.env.local

      # Apple tools auto-discover the .p8 at this conventional path.
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # The ios release lane picks the next build number from TestFlight,
      # derives the full app version from it, builds, signs (match, read-only)
      # and uploads, rebuilding with a fresh number and version when the upload
      # is rejected for a conflict. ssh-agent is started
      # inline because its env can't cross workflow steps.
      - name: Build, sign & upload to TestFlight
        id: build_sign_upload
        working-directory: example
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          RCT_NEW_ARCH_ENABLED: '1'
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add -
          CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_P12_PATH"
          export CERT_P12_PATH
          fastlane ios release

      # What to Test is composed here, after the final upload, so it carries
      # the build number that actually shipped. 4000 chars is App Store
      # Connect's whatsNew cap.
      - name: Prepare release notes
        id: release_notes
        uses: ./.github/actions/example-release-notes
        with:
          max_length: 4000
          platform: ios

      - name: Record uploaded version
        id: result
        shell: bash
        env:
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          DELIM="EOF-$RANDOM-$RANDOM"
          {
            echo "marketing_version=$MARKETING_VERSION"
            echo "full_version=$FULL_VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "app_id=$ASC_APP_ID"
            echo "testflight_url=https://beta.itunes.apple.com/v1/app/$ASC_APP_ID"
            echo "notes<<$DELIM"
            cat "$NOTES_FILE"
            echo ""
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Clean up distribution certificate, ssh key and config files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dist.p12" example/ios/GoogleService-Info.plist example/.env
          if [ -n "${SSH_AUTH_SOCK:-}" ]; then
            ssh-add -D 2>/dev/null || true
            ssh-agent -k 2>/dev/null || true
          fi

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: iOS
          store: TestFlight
          full_version: ${{ env.FULL_VERSION }}
          build: ${{ env.BUILD_NUMBER }}
          sdks: ${{ steps.release_notes.outputs.sdks }}
          install_url: ${{ steps.result.outputs.testflight_url }}
          install_label: Open the example app in TestFlight
          access_note: Install version ${{ env.FULL_VERSION }} (${{ env.BUILD_NUMBER }}) once Apple finishes processing it, usually 5–30 min after upload.

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          steps_json: ${{ toJSON(steps) }}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: iOS
          store: TestFlight
          full_version: ${{ env.FULL_VERSION }}
          build: ${{ env.BUILD_NUMBER }}

  # Runs on Linux so no macOS runner is held while Apple processes the build.
  what-to-test:
    name: Set TestFlight "What to Test"
    needs: deploy-ios
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: |
      !cancelled() && needs.deploy-ios.result == 'success' && (
        github.event_name == 'release'
        || github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
        || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios'))
      )
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        id: setup_ruby
        continue-on-error: true
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.2'

      - name: Write App Store Connect API key
        id: write_key
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Save What to Test notes
        id: save_notes
        continue-on-error: true
        shell: bash
        env:
          NOTES: ${{ needs.deploy-ios.outputs.notes }}
        run: printf '%s' "$NOTES" > "$GITHUB_WORKSPACE/what-to-test.txt"

      - name: Install fastlane
        id: install_fastlane
        if: steps.setup_ruby.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: gem install -g .github/pins/fastlane/Gemfile --no-document

      - name: Set What to Test on the uploaded build
        id: set_whats_new
        if: steps.setup_ruby.outcome == 'success' && steps.install_fastlane.outcome == 'success' && steps.write_key.outcome == 'success' && steps.save_notes.outcome == 'success'
        continue-on-error: true
        working-directory: example
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MARKETING_VERSION: ${{ needs.deploy-ios.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.deploy-ios.outputs.build_number }}
          NOTES_FILE: ${{ github.workspace }}/what-to-test.txt
        shell: bash
        run: fastlane ios whats_new

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      # The build is already on TestFlight; a failure here only costs the
      # notes, so warn instead of failing the run.
      - name: Warn on Slack when What to Test failed
        if: steps.setup_ruby.outcome == 'failure' || steps.install_fastlane.outcome == 'failure' || steps.write_key.outcome == 'failure' || steps.save_notes.outcome == 'failure' || steps.set_whats_new.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: warning
          platform: iOS
          store: TestFlight
          full_version: ${{ needs.deploy-ios.outputs.full_version }}
          build: ${{ needs.deploy-ios.outputs.build_number }}

  # Remove the deploy-example-app[:platform] label after the run so reapplying
  # re-triggers. Handles all three variants: umbrella, :android, :ios.
  cleanup-label:
    name: Remove deploy-example-app label
    needs:
      [checks, preflight-android, preflight-ios, deploy-android, deploy-ios]
    if: |
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.label.name, 'deploy-example-app')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL_NAME,
              });
            } catch (e) {
              // 404 = label already gone (e.g. removed manually mid-run).
              if (e.status !== 404) throw e;
            }
