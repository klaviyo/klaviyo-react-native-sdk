# Publish the example app to Play internal track + TestFlight. Android and
# iOS are independent jobs.
#
# Triggers:
#   - workflow_dispatch     (manual; choose `both` / `android` / `ios`)
#   - release: published    (both platforms)
#   - push to master/rel/** (both platforms)
#   - pull_request: labeled (label drives platform selection — see below)
#
# Label conventions (cleanup-label removes them after the run so reapplying
# re-triggers):
#   - `deploy-example-app`         → both platforms
#   - `deploy-example-app:android` → Android only
#   - `deploy-example-app:ios`     → iOS only
#
# Build numbers: Android versionCode is globally monotonic (highest on Play
# + 1); iOS build numbers restart at 1 per marketing version and strictly
# increase within it. Each job preflights the store, then retries with a
# fresh number if the upload is rejected for a conflict (e.g. two runs racing
# on master + rel/**).
#
# Deploys run only after the `checks` (ci.yml: lint, unit tests, library
# build) and `publish-checks` (workflow/script checks) jobs pass in the same
# run, on every trigger including the PR-label one.
#
# This repo is public, so its Actions logs are too. Never surface a public
# install link (e.g. a TestFlight public-link `testflight.apple.com/join/...`)
# here; only links that require a Play/App Store Connect login. The Android
# Internal App Sharing URL is masked (::add-mask) right after it is read so
# it only appears in the Slack message, and it is not set as the
# android-internal-track environment URL, which the public Deployments page
# would show.

name: Publish Example App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform(s) to publish'
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios
  release:
    types: [published]
  push:
    branches: [master, 'rel/**']
  pull_request:
    types: [labeled]

# A newer push to the same branch cancels the run in flight. Release, manual
# and PR-label runs are never cancelled.
concurrency:
  group: publish-example-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

# Shared event fields for every step that stamps build info or renders
# notes/Slack, so the app, the store notes and the Slack message can never
# disagree about the commit, branch or trigger. On pull_request events
# github.sha is the synthetic merge commit and github.ref_name is
# "123/merge", so both prefer the PR head.
env:
  EVENT_NAME: ${{ github.event_name }}
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BRANCH: ${{ github.head_ref || github.ref_name }}
  HEAD_REF: ${{ github.head_ref }}
  REF_NAME: ${{ github.ref_name }}

jobs:
  # Only run for triggers that can deploy: any other PR label must not start
  # the full macOS CI or the publish-helper suite.
  checks:
    name: Lint, test and build the library
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.label.name, 'deploy-example-app'))
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish-checks:
    name: Publish workflow and script checks
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.label.name, 'deploy-example-app'))
    permissions:
      contents: read
    uses: ./.github/workflows/example-publish-checks.yml

  # Verifies the platform's required secrets exist before a deploy runs.
  # Environment secrets are not visible here (no environment: is declared),
  # so the store secrets must be repository secrets. Missing secrets skip the
  # deploy on push/release (ready=false, green) and fail on
  # workflow_dispatch / label deploys.
  preflight-android:
    name: Check Android deploy secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.android_ready }}
      missing: ${{ steps.check.outputs.android_missing }}
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'android'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:android'))
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check secrets
        id: check
        shell: bash
        env:
          KLAVIYO_EXAMPLE_API_KEY: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: .github/scripts/check-secrets.sh android

  preflight-ios:
    name: Check iOS deploy secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ios_ready }}
      missing: ${{ steps.check.outputs.ios_missing }}
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios'))
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check secrets
        id: check
        shell: bash
        env:
          KLAVIYO_EXAMPLE_API_KEY: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/check-secrets.sh ios

  deploy-android:
    name: Publish to Play Store internal track
    needs: [checks, publish-checks, preflight-android]
    runs-on: ubuntu-24.04
    environment:
      name: android-internal-track
    # Run on release / push always; on workflow_dispatch when platform is
    # `both` or `android`; on labeled PR when the label is `deploy-example-app`
    # (umbrella) or `deploy-example-app:android`. Skipped (not failed) when the
    # preflight found missing secrets on a push/release trigger.
    if: |
      (github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'android'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:android')))
      && needs.preflight-android.outputs.ready == 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prep example app
        uses: ./.github/actions/example-publish-prep
        with:
          api_key: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}

      # bundleRelease invokes Metro via the RN Gradle plugin; node + yarn must be on PATH.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: jdk

      # The version assertion after the build needs aapt2; fail here, in
      # seconds, rather than after a full bundle build.
      - name: Check the version assertion's tools exist
        shell: bash
        run: .github/scripts/assert-artifact-version.sh --check-tools android

      - name: Add Google Services from Secrets
        run: 'echo "$GOOGLE_SERVICES_JSON" > ./example/android/app/google-services.json'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Decode upload keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/upload.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      # Read versionName (kept in sync with SDK version by bump-version.sh)
      # so Slack notifications can include it on success or failure.
      - name: Read versionName
        shell: bash
        run: |
          VERSION_NAME=$(grep -oE 'versionName "[^"]+"' example/android/app/build.gradle | head -1 | sed -E 's/versionName "([^"]+)"/\1/')
          echo "Version name: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      # Auth for the Play Edits API calls in play-publish.sh.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      # Pick highest+1 versionCode. The script aborts on any HTTP error
      # rather than falling back to HIGHEST=0.
      - name: Resolve next versionCode from Play
        id: resolve_version_code
        shell: bash
        env:
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
        run: |
          set -euo pipefail
          HIGHEST=$(.github/scripts/play-publish.sh highest-version-code)
          NEXT=$(( HIGHEST + 1 ))
          echo "Highest existing versionCode: $HIGHEST"
          echo "Next versionCode: $NEXT"
          echo "VERSION_CODE=$NEXT" >> "$GITHUB_ENV"

      # Builds the example app against the SDK as `npm install`-ed from a
      # tarball, not the workspace symlink. See pack-and-test.sh.
      - name: Pack SDK + flip example to packed install
        id: pack_sdk
        shell: bash
        run: ./pack-and-test.sh setup

      # Writes the SDK version/ref block to example/.env for the app UI and
      # release notes; a missing ref resolves to "unknown" without failing.
      - name: Record SDK versions in example/.env
        shell: bash
        run: node example/scripts/sdk-ref.js --commit "$COMMIT_SHA" --branch "$BRANCH"

      # Build + upload in one loop: a versionCode conflict at upload time
      # (another run published the same code after our preflight) rebuilds
      # with a fresh code. play-publish.sh exits 75 only for a conflict; any
      # other error fails the step immediately.
      #
      # The release notes are regenerated per attempt (build-release-notes)
      # so they always carry the versionCode that actually ships, and the
      # in-app build info (.env) is regenerated per attempt too, with the
      # Metro cache cleared so a rebuild can't inline the old values.
      #
      # Inline signing via -Pandroid.injected.signing.* — Play rejects
      # double-signed AABs.
      #
      # The build goes through gradle-retry.sh: the Klaviyo Android SDK
      # resolves from JitPack, which builds branch/commit targets on first
      # request and can time out or 404 on a cold start.
      - name: Build & deploy to Internal Track
        id: build_and_deploy
        shell: bash
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Prevent Metro from trying to start a dev server during the build
          CI: true
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          AAB="example/android/app/build/outputs/bundle/release/app-release.aab"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.txt"

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Attempt $attempt/$MAX_ATTEMPTS: versionCode $VERSION_CODE ==="
            # One timestamp per attempt, shared by the in-app build info and
            # the store notes header so they match.
            BUILT_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"
            node example/scripts/sdk-ref.js --build "$VERSION_CODE" --commit "$COMMIT_SHA" --branch "$BRANCH" --built "$BUILT_AT"
            rm -rf "${TMPDIR:-/tmp}/metro-cache" "example/android/app/build/generated"
            (cd example/android && ../../.github/scripts/gradle-retry.sh :app:bundleRelease \
              -PreleaseVersionCode="$VERSION_CODE" \
              -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/upload.jks" \
              -Pandroid.injected.signing.store.password="${KEY_STORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
              -Dorg.gradle.internal.http.socketTimeout=120000)

            # Refuse to upload a bundle whose manifest disagrees with the
            # version being attempted.
            .github/scripts/assert-artifact-version.sh android "$AAB" "$VERSION_CODE" "$VERSION_NAME"

            .github/scripts/build-release-notes.sh android 500 > "$NOTES_FILE"
            echo "BUILT_AT=$BUILT_AT" >> "$GITHUB_ENV"

            status=0
            RELEASE_NAME="$VERSION_NAME ($VERSION_CODE)" \
              .github/scripts/play-publish.sh upload "$AAB" "$VERSION_CODE" internal "$NOTES_FILE" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            elif [ "$status" -ne 75 ]; then
              exit "$status"
            fi

            HIGHEST=$(.github/scripts/play-publish.sh highest-version-code)
            NEXT=$(( (HIGHEST > VERSION_CODE ? HIGHEST : VERSION_CODE) + 1 ))
            echo "::warning::versionCode $VERSION_CODE conflicted at upload; retrying with $NEXT"
            VERSION_CODE=$NEXT
            echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          done

          echo "::error::Upload still conflicting after $MAX_ATTEMPTS attempts"
          exit 1

      # Internal App Sharing gives the Slack message an install link. A
      # failure here must not fail a deploy that already landed on the track.
      - name: Upload to Internal App Sharing
        id: internal_sharing
        continue-on-error: true
        shell: bash
        env:
          PACKAGE_NAME: com.klaviyoreactnativesdkexample
        run: |
          set -euo pipefail
          url=$(.github/scripts/play-publish.sh internal-sharing "example/android/app/build/outputs/bundle/release/app-release.aab")
          if [ -z "$url" ]; then
            echo "::warning::Internal App Sharing did not return a download URL"
            exit 1
          fi
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Composed after the upload so the notes carry the versionCode that
      # actually shipped. 500 chars is Google's per-locale cap.
      - name: Prepare release notes
        id: release_notes
        uses: ./.github/actions/example-release-notes
        with:
          max_length: 500
          platform: android

      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"

      - name: Clean up google-services.json and example/.env
        if: always()
        shell: bash
        run: rm -f example/android/app/google-services.json example/.env

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: Android
          store: Play internal
          full_version: ${{ env.VERSION_NAME }}
          build: ${{ env.VERSION_CODE }}
          rn_version: ${{ steps.release_notes.outputs.rn_version }}
          rn_ref: ${{ steps.release_notes.outputs.rn_ref }}
          native_name: Android
          native_version: ${{ steps.release_notes.outputs.native_version }}
          native_ref: ${{ steps.release_notes.outputs.native_ref }}
          install_url: ${{ steps.internal_sharing.outputs.url }}
          install_label: Internal App Sharing link
          install_fallback: Internal App Sharing upload failed, see the workflow run

      - name: Find failed step
        id: failed
        if: failure()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: echo "name=$(.github/scripts/failed-step.sh "$STEPS_JSON")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          failed_step: ${{ steps.failed.outputs.name }}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: Android
          store: Play internal
          full_version: ${{ env.VERSION_NAME }}
          build: ${{ env.VERSION_CODE }}
          native_name: Android

  deploy-ios:
    name: Publish to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: testflight
      url: ${{ steps.result.outputs.testflight_url }}
    needs: [checks, publish-checks, preflight-ios]
    outputs:
      marketing_version: ${{ steps.result.outputs.marketing_version }}
      full_version: ${{ steps.result.outputs.full_version }}
      build_number: ${{ steps.result.outputs.build_number }}
      app_id: ${{ steps.result.outputs.app_id }}
      notes: ${{ steps.result.outputs.notes }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    # Run on release / push always; on workflow_dispatch when platform is
    # `both` or `ios`; on labeled PR when the label is `deploy-example-app`
    # (umbrella) or `deploy-example-app:ios`. Skipped (not failed) when the
    # preflight found missing secrets on a push/release trigger.
    if: |
      (github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios')))
      && needs.preflight-ios.outputs.ready == 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Prep example app
        uses: ./.github/actions/example-publish-prep
        with:
          api_key: ${{ secrets.KLAVIYO_EXAMPLE_API_KEY }}

      # The RN Xcode build phase invokes Metro during archive; node + yarn must be on PATH.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          # ruby-version is read from example/.ruby-version. bundler-cache:true
          # also runs `bundle install --frozen` against example/Gemfile, so
          # any Gemfile / Gemfile.lock drift fails this step early.
          working-directory: example
          bundler-cache: true

      # setup-ruby switches the job to the example's pinned Ruby, which hides the
      # runner's preinstalled fastlane and doesn't have it as a gem. Install it
      # explicitly into the active Ruby so `fastlane` resolves deterministically.
      # Kept out of example/Gemfile to avoid bloating the CocoaPods-only bundle.
      - name: Install fastlane
        shell: bash
        run: gem install fastlane -v 2.237.0 --no-document

      # Real GoogleService-Info.plist (com.klaviyoreactnativesdkexample) so
      # push delivery works against the published build.
      - name: Inject GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        shell: bash
        run: echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 -d > example/ios/GoogleService-Info.plist

      # See ios-build.yml's Cache Pods step for the cache-key rationale.
      - name: Cache Pods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: example/ios/Pods
          key: ${{ runner.os }}-pods-publish-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock', 'example/.ruby-version', '*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-pods-publish-

      # Builds the example app against the SDK as `npm install`-ed from a
      # tarball, not the workspace symlink. See pack-and-test.sh. Must run
      # before "Install CocoaPods dependencies" so pod install picks up the
      # packed-mode resolution.
      - name: Pack SDK + flip example to packed install
        shell: bash
        run: ./pack-and-test.sh setup

      # --repo-update so stale CDN caches can't pin us to old versions.
      # Delete .xcode.env.local so the Xcode build phase falls back to
      # `command -v node` (resolves to the setup-node binary on $PATH).
      # RCT_NEW_ARCH_ENABLED=1 is required for new-arch codegen to run
      # during pod install — otherwise xcodebuild fails on missing headers
      # like RCTAppDependencyProvider.h. With pack-and-test having flipped
      # the marker above, this pod install runs in packed mode.
      - name: Install CocoaPods dependencies
        id: pod_install
        working-directory: example/ios
        shell: bash
        env:
          RCT_NEW_ARCH_ENABLED: '1'
        run: |
          bundle exec pod install --repo-update
          rm -f .xcode.env.local

      # After pod install so Podfile.lock reflects the resolved KlaviyoSwift
      # pin, and before the Xcode build inlines .env via Metro. A missing ref
      # resolves to "unknown" without failing.
      - name: Record SDK versions in example/.env
        shell: bash
        run: node example/scripts/sdk-ref.js --commit "$COMMIT_SHA" --branch "$BRANCH"

      # Apple tools auto-discover the .p8 at this conventional path.
      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      # package.json carries the full SDK version (possibly a prerelease like
      # 2.6.0-rc.1). CFBundleShortVersionString must be numeric X.Y[.Z], so
      # the marketing version used for the build and the ASC build-number
      # sequence is the stripped value; the full version is what humans see
      # in Slack and the notes.
      - name: Resolve full and marketing versions
        shell: bash
        run: |
          FULL_VERSION=$(jq -r .version package.json)
          MARKETING_VERSION=$(ruby .github/scripts/asc.rb ios-marketing-version "$FULL_VERSION")
          echo "Full version: $FULL_VERSION"
          echo "Marketing version: $MARKETING_VERSION"
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"

      # Build numbers restart at 1 per marketing version. A failed query here
      # stops the job before any build runs. `jwt` is installed inline rather
      # than added to example/Gemfile.
      - name: Resolve next build number from App Store Connect
        id: resolve_build_number
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
        shell: bash
        run: |
          gem install jwt --no-document --silent
          ruby .github/scripts/asc.rb next-build-number --marketing-version "$MARKETING_VERSION"

      # Build, sign and upload in one loop (same shape as
      # klaviyo-ios-test-app's testflight.yml). A build-number conflict at
      # upload time rebuilds with a fresh number. After archive+export the
      # build number is re-resolved per marketing version: if a concurrent
      # run took it, this attempt rebuilds without uploading; the final
      # attempt always uploads.
      #
      # The `release_ipa` lane runs match(readonly) to install the shared App
      # Store cert + profiles from the mobile-certificates repo (git-only, so
      # it never contacts Apple or generates a cert), pins each target to its
      # match profile, and exports a signed IPA to example/ios/build/.
      # ssh-agent is started inline because its env can't cross workflow steps.
      #
      # altool authenticates with the API key. agvtool updates CFBundleVersion
      # across all targets.
      - name: Build, sign & upload to TestFlight
        id: build_sign_upload
        working-directory: example
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          # For asc.rb when re-resolving the build number after a conflict.
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Password-protected distribution key: match imports keys with an empty
          # password, which macOS 26's `security import` rejects, so the lane
          # imports this one itself. See example/fastlane/Fastfile.
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          # RN build-phase scripts read this directly to wire codegen outputs.
          RCT_NEW_ARCH_ENABLED: '1'
          # Prevent Metro from starting a dev server.
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add -
          CERT_P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > "$CERT_P12_PATH"
          export CERT_P12_PATH

          MAX_ATTEMPTS=4
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== Attempt $attempt/$MAX_ATTEMPTS: build number $BUILD_NUMBER ==="
            rm -f ios/build/KlaviyoReactNativeSdkExample.ipa
            # Pin the marketing version too: the pbxproj can be stale, and
            # CFBundleShortVersionString must never carry a prerelease suffix.
            (cd ios && xcrun agvtool new-marketing-version "$MARKETING_VERSION" && xcrun agvtool new-version -all "$BUILD_NUMBER")
            # Refresh the in-app build info and clear the Metro cache so a
            # rebuild after a conflict can't inline the previous number.
            node scripts/sdk-ref.js --build "$BUILD_NUMBER" --commit "$COMMIT_SHA" --branch "$BRANCH" --built "$(date -u '+%Y-%m-%d %H:%M UTC')"
            rm -rf "$TMPDIR/metro-cache" "$TMPDIR/haste-map-"*
            fastlane ios release_ipa

            # Refuse to upload an IPA whose plist disagrees with the version
            # being attempted.
            ../.github/scripts/assert-artifact-version.sh ios ios/build/KlaviyoReactNativeSdkExample.ipa "$BUILD_NUMBER" "$MARKETING_VERSION"

            if ruby ../.github/scripts/asc.rb next-build-number --marketing-version "$MARKETING_VERSION" --minimum "$BUILD_NUMBER"; then
              ASC_NEXT=$(grep -E '^BUILD_NUMBER=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)
              if [ "$ASC_NEXT" -gt "$BUILD_NUMBER" ] && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "Build $BUILD_NUMBER was taken since preflight — rebuilding with $ASC_NEXT"
                BUILD_NUMBER=$ASC_NEXT
                echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
                continue
              fi
            else
              echo "::warning::Pre-upload re-check failed; relying on upload conflict detection"
            fi

            status=0
            UPLOAD_OUTPUT=$(xcrun altool --upload-app --type ios \
              --file "ios/build/KlaviyoReactNativeSdkExample.ipa" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1) || status=$?
            echo "$UPLOAD_OUTPUT"

            # altool can exit 0 while reporting an error, so check both.
            if [ "$status" -eq 0 ] && ! grep -q "ERROR:" <<<"$UPLOAD_OUTPUT"; then
              echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
              exit 0
            fi

            # A duplicate CFBundleVersion is reported with the previous
            # version in the payload (or as ITMS-90189 from transporter);
            # anything else is non-recoverable.
            if ! grep -qiE 'previousBundleVersion|bundle version must be higher|has already been used|DUPLICATE|ITMS-90189|Redundant Binary Upload' <<<"$UPLOAD_OUTPUT"; then
              echo "::error::TestFlight upload failed with a non-recoverable error"
              exit 1
            fi

            PREV_BUILD=$(grep -oE 'previousBundleVersion = [0-9]+' <<<"$UPLOAD_OUTPUT" | head -1 | grep -oE '[0-9]+' || true)
            CURRENT=$BUILD_NUMBER
            ruby ../.github/scripts/asc.rb next-build-number --marketing-version "$MARKETING_VERSION" >/dev/null
            # asc.rb appended the fresh value to $GITHUB_ENV; take the max of
            # that, altool's previousBundleVersion + 1 and ours + 1.
            ASC_NEXT=$(grep -E '^BUILD_NUMBER=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)
            NEXT=$(( CURRENT + 1 ))
            if [ -n "$PREV_BUILD" ] && [ $(( PREV_BUILD + 1 )) -gt "$NEXT" ]; then
              NEXT=$(( PREV_BUILD + 1 ))
            fi
            if [ "$ASC_NEXT" -gt "$NEXT" ]; then
              NEXT=$ASC_NEXT
            fi
            echo "::warning::Build number $CURRENT conflicted at upload; retrying with $NEXT"
            BUILD_NUMBER=$NEXT
            echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          done

          echo "::error::Upload still conflicting after $MAX_ATTEMPTS attempts"
          exit 1

      # What to Test is composed here, after the final upload, so it carries
      # the build number that actually shipped. 4000 chars is App Store
      # Connect's whatsNew cap.
      - name: Prepare release notes
        id: release_notes
        uses: ./.github/actions/example-release-notes
        with:
          max_length: 4000
          platform: ios

      - name: Record uploaded version
        id: result
        shell: bash
        env:
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          DELIM="EOF-$RANDOM-$RANDOM"
          {
            echo "marketing_version=$MARKETING_VERSION"
            echo "full_version=$FULL_VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "app_id=$ASC_APP_ID"
            echo "testflight_url=https://beta.itunes.apple.com/v1/app/$ASC_APP_ID"
            echo "notes<<$DELIM"
            cat "$NOTES_FILE"
            echo ""
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Clean up distribution certificate, ssh key and config files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dist.p12" example/ios/GoogleService-Info.plist example/.env
          if [ -n "${SSH_AUTH_SOCK:-}" ]; then
            ssh-add -D 2>/dev/null || true
            ssh-agent -k 2>/dev/null || true
          fi

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          platform: iOS
          store: TestFlight
          full_version: ${{ env.FULL_VERSION }}
          build: ${{ env.BUILD_NUMBER }}
          rn_version: ${{ steps.release_notes.outputs.rn_version }}
          rn_ref: ${{ steps.release_notes.outputs.rn_ref }}
          native_name: iOS
          native_version: ${{ steps.release_notes.outputs.native_version }}
          native_ref: ${{ steps.release_notes.outputs.native_ref }}
          install_url: ${{ steps.result.outputs.testflight_url }}
          install_label: Open the example app in TestFlight
          access_note: Install version ${{ env.FULL_VERSION }} (${{ env.BUILD_NUMBER }}) once Apple finishes processing it, usually 5–30 min after upload. Not a tester yet? Ask in #mobile-push-team to be added to the internal TestFlight group with your Apple ID email.

      - name: Find failed step
        id: failed
        if: failure()
        shell: bash
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: echo "name=$(.github/scripts/failed-step.sh "$STEPS_JSON")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack-publish
        with:
          failed_step: ${{ steps.failed.outputs.name }}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          platform: iOS
          store: TestFlight
          full_version: ${{ env.FULL_VERSION }}
          build: ${{ env.BUILD_NUMBER }}
          native_name: iOS

  # Runs on Linux so no macOS runner is held while Apple processes the build.
  what-to-test:
    name: Set TestFlight "What to Test"
    needs: deploy-ios
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: |
      github.event_name == 'release'
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'both' || inputs.platform == 'ios'))
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.label.name == 'deploy-example-app' || github.event.label.name == 'deploy-example-app:ios'))
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Write App Store Connect API key
        id: write_key
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        shell: bash
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

      - name: Save What to Test notes
        id: save_notes
        continue-on-error: true
        shell: bash
        env:
          NOTES: ${{ needs.deploy-ios.outputs.notes }}
        run: printf '%s' "$NOTES" > what-to-test.txt

      - name: Set What to Test on the uploaded build
        id: set_whats_new
        if: steps.write_key.outcome == 'success' && steps.save_notes.outcome == 'success'
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          BUNDLE_ID: com.klaviyoreactnativesdkexample
        shell: bash
        run: |
          gem install jwt --no-document --silent
          ruby .github/scripts/asc.rb set-whats-new \
            "${{ needs.deploy-ios.outputs.marketing_version }}" \
            "${{ needs.deploy-ios.outputs.build_number }}" \
            what-to-test.txt

      - name: Clean up API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      # The build is already on TestFlight; a failure here only costs the
      # notes, so warn instead of failing the run.
      - name: Warn on Slack when What to Test failed
        if: steps.write_key.outcome == 'failure' || steps.save_notes.outcome == 'failure' || steps.set_whats_new.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: warning
          platform: iOS
          store: TestFlight
          full_version: ${{ needs.deploy-ios.outputs.full_version }}
          build: ${{ needs.deploy-ios.outputs.build_number }}
          native_name: iOS

  # Remove the deploy-example-app[:platform] label after the run so reapplying
  # re-triggers. Handles all three variants: umbrella, :android, :ios.
  cleanup-label:
    name: Remove deploy-example-app label
    needs:
      [
        checks,
        publish-checks,
        preflight-android,
        preflight-ios,
        deploy-android,
        deploy-ios,
      ]
    if: |
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.label.name, 'deploy-example-app')
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: process.env.LABEL_NAME,
              });
            } catch (e) {
              // 404 = label already gone (e.g. removed manually mid-run).
              if (e.status !== 404) throw e;
            }
