# Uploads the resolved Gradle dependency graph of the android/ bridge module to GitHub's
# dependency submission API, so the dependency graph, Dependabot alerts and Dependabot
# security updates cover Maven packages. GitHub cannot parse Gradle builds on its own.
# example/android is intentionally not covered.

name: Dependency Submission

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  dependency-submission:
    name: Submit Gradle Dependency Graph

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The React Native Gradle plugin and react-native resolve from node_modules
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      # Pinned by SHA: this action submits to the GitHub API with a write token
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android
