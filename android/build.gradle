buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault.
  //
  // Two independent selections, because two different builds evaluate this file:
  //
  //   - Standalone, with this folder as its own root project. Nothing else supplies plugins
  //     and the wrapper here is Gradle 9.3.1, so it needs a Kotlin plugin that can drive
  //     that. React Native's own @react-native/gradle-plugin runs exactly this pairing --
  //     it pins kotlin 2.1.20 and ships a gradle-9.3.1 wrapper -- so we match it.
  //
  //   - Inside a host app. Plugins load parent-first, so a host declaring its own Kotlin
  //     plugin wins and neither value below applies. Only hosts declaring none reach the
  //     fallback, and those are React Native 0.72 and older, whose templates ship Gradle
  //     7.5.1 and set no ext.kotlinVersion. That value must stay low enough for 7.5.1,
  //     which rules out 2.1.20 (it needs Gradle >= 7.6.3).
  //
  // Collapsing these into one property is what broke old consumers: the version the
  // standalone build needs is far above the version an RN 0.70 host can accept.
  def kotlin_version = project == rootProject
    ? project.properties["KlaviyoReactNativeSdk_standaloneKotlinVersion"]
    : (rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["KlaviyoReactNativeSdk_kotlinVersion"])

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // The Android Gradle Plugin is only required when this folder is opened as its own root
    // project. Every React Native app template declares AGP in its own root build.gradle, and
    // Gradle loads plugins parent-first, so inside a host app that declaration wins and this
    // entry is never used. Declaring it unconditionally only resolves a version the host discards.
    if (project == rootProject) {
      classpath "com.android.tools.build:gradle:8.10.1"
    }

    // The Kotlin plugin, by contrast, must stay unconditional. React Native templates only began
    // declaring kotlin-gradle-plugin at 0.73, and a subproject's buildscript classpath is not
    // shared with its siblings, so on 0.72 and older this entry is the only thing that supplies
    // `kotlin-android` to this module. A host that declares its own Kotlin plugin still wins,
    // parent-first; kotlin_version above only takes effect when the host declares none.
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["KlaviyoReactNativeSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["KlaviyoReactNativeSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.klaviyoreactnativesdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  maven { url "https://jitpack.io" }
  mavenCentral()
  google()
}

def klaviyoAndroidSdkVersion = getExtOrDefault("klaviyoAndroidSdkVersion")
// Mirrors the split in the buildscript block above, so kotlin-reflect always matches the
// stdlib that the Kotlin plugin actually applied for this build.
def kotlin_version = (project == rootProject)
  ? getExtOrDefault("standaloneKotlinVersion")
  : getExtOrDefault("kotlinVersion")
def localProperties = new Properties()
if (rootProject.file("local.properties").canRead()) {
  localProperties.load(new FileInputStream(rootProject.file("local.properties")))
}
def reactNativeAndroidVersion = localProperties['reactNativeAndroidVersion'] ?: ""

// Whether to include the full location module (geofencing + location permissions).
// Set klaviyoIncludeLocation=false in your gradle.properties to use lightweight location-core instead.
def includeLocation = rootProject.hasProperty('klaviyoIncludeLocation')
    ? rootProject.property('klaviyoIncludeLocation').toBoolean()
    : true

// Whether to include the full forms module (in-app forms rendering).
// Set klaviyoIncludeForms=false in your gradle.properties to use lightweight forms-core instead.
def includeForms = rootProject.hasProperty('klaviyoIncludeForms')
    ? rootProject.property('klaviyoIncludeForms').toBoolean()
    : true

dependencies {
  if (reactNativeAndroidVersion) {
    // For local development of the SDK code, specify the react-android version to use
    // So that the SDK can be built and .kt files are linted against a real version of react-native
    implementation "com.facebook.react:react-android:$reactNativeAndroidVersion"
  } else {
    // Production build / once embedded in a react-native app,
    // the react-native version gets loaded in from the application dependencies.
    // For < 0.71, this will be from the local maven repo
    // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
    //noinspection GradleDynamicVersion
    implementation "com.facebook.react:react-native:+"
  }

  // Klaviyo Android SDK
  api "com.github.klaviyo.klaviyo-android-sdk:analytics:$klaviyoAndroidSdkVersion"
  api "com.github.klaviyo.klaviyo-android-sdk:push-fcm:$klaviyoAndroidSdkVersion"
  implementation "com.github.klaviyo.klaviyo-android-sdk:core:$klaviyoAndroidSdkVersion"

  // Location: full module (includes -core transitively), or just -core for lightweight
  if (includeLocation) {
    api "com.github.klaviyo.klaviyo-android-sdk:location:$klaviyoAndroidSdkVersion"
  } else {
    implementation "com.github.klaviyo.klaviyo-android-sdk:location-core:$klaviyoAndroidSdkVersion"
  }

  // Forms: full module (includes -core transitively), or just -core for lightweight
  if (includeForms) {
    api "com.github.klaviyo.klaviyo-android-sdk:forms:$klaviyoAndroidSdkVersion"
  } else {
    implementation "com.github.klaviyo.klaviyo-android-sdk:forms-core:$klaviyoAndroidSdkVersion"
  }

  // We use reflection to enumerate keywords in the Klaviyo Android SDK dynamically.
  // kotlin-reflect must resolve to the same version as the Kotlin stdlib, otherwise it fails at
  // runtime. We do not declare the stdlib ourselves: kotlin.stdlib.default.dependency defaults to
  // true, so the Kotlin plugin injects one matching the compiler that actually runs. Declaring a
  // stdlib here would instead set a floor for the whole graph -- Gradle resolves version conflicts
  // highest-wins, so an explicit 2.1.20 drags every transitive 1.8.x request up with it and can
  // leave a newer stdlib under an older compiler. Track $kotlin_version so reflect follows the
  // same selection. Consuming apps override it via rootProject.ext.kotlinVersion.
  implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
}

